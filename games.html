<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Knof's Spelletjes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>
  <!-- SVG filters for hand-drawn effect -->
  <svg class="svg-filters">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie -->
  <div id="top-nav-container"></div>

  <!-- Settings modal container -->
  <div id="settings-modal-container"></div>

  <!-- Hoofdcontent - Spelletjespagina -->
  <div class="app-container">
    <h1 class="page-title">Knof's Spelletjeshoek</h1>
    
    <div class="games-container">
      <div class="game-item" id="memory-game">
        <div class="game-item-bg"></div>
        <h2>Memory</h2>
        <p>Test je geheugen met Knof!</p>
        <div class="game-preview">
          <!-- Game preview content -->
          <img src="images/memory-preview.png" alt="Memory spel voorbeeld" style="max-height: 100%; width: auto;">
        </div>
      </div>
      
      <div class="game-item" id="puzzle-game">
        <div class="game-item-bg"></div>
        <h2>Puzzel</h2>
        <p>Maak de puzzel compleet</p>
        <div class="game-preview">
          <!-- Game preview content -->
          <img src="images/puzzle-preview.png" alt="Puzzel spel voorbeeld" style="max-height: 100%; width: auto;">
        </div>
      </div>
      
      <div class="game-item" id="drawing-game">
        <div class="game-item-bg"></div>
        <h2>Raad mijn tekening</h2>
        <p>Raad wat Knof tekent</p>
        <div class="game-preview">
          <!-- Game preview content -->
          <img src="images/drawing-preview.png" alt="Tekening spel voorbeeld" style="max-height: 100%; width: auto;">
        </div>
      </div>
    </div>
  </div>

  <!-- Container voor bottom navigatie -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script src="js/games.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Welkomstbericht voor games pagina
      setTimeout(() => {
        typeSpeechMessage("Welkom bij de spelletjes! Wat wil je spelen? Ik vind ze allemaal leuk!");
      }, 500);
      
      // Event listeners voor spelletjes
      document.getElementById('memory-game').addEventListener('click', () => {
        window.location.href = 'games/memory.html';
      });
      
      document.getElementById('puzzle-game').addEventListener('click', () => {
        window.location.href = 'games/puzzle.html';
      });
      
      document.getElementById('drawing-game').addEventListener('click', () => {
        window.location.href = 'games/drawing.html';
      });
    });
  </script>
</body>
</html>
