<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Knof's Spelletjes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
    /* Aanpassingen voor games.html om emoji's te overschrijven */
    .section-bg-games::after,
    .section-bg-coloring::after,
    .section-bg-placemat::after {
      content: none !important; /* Verwijdert de emoji's */
    }
    
    /* Stijlen voor de spel-popup */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(248, 246, 233, 0.9);
      z-index: 1000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .modal-content {
      background-color: #FFFFFF;
      border-radius: 20px;
      border: 3px solid #DDD8C4;
      padding: 30px 25px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      filter: url(#rough-filter); /* Hand-drawn effect */
    }
    
    .modal-title {
      margin: 0 0 25px;
      font-size: 1.8rem;
      color: #55A54A;
      filter: url(#rough-filter); /* Hand-drawn effect */
    }
    
    /* Stijl voor de terugknop */
    .modal-button {
      margin-top: 25px;
      background-color: #F4F1E4;
      border: 2px solid #6B5344;
      border-radius: 12px;
      padding: 12px 25px;
      color: #6B5344;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.2s;
      filter: url(#rough-filter); /* Hand-drawn effect */
    }
    
    .modal-button:active {
      background-color: #E8E4D0;
      transform: scale(0.98);
    }
    
    /* Specifieke stijl voor de knoppen in de pop-up */
    .modal .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: 0 auto;
    }
    
    .modal .button {
      border-radius: 15px;
      overflow: hidden;
      filter: url(#rough-filter); /* Hand-drawn effect */
      margin: 0 auto;
      width: 100%;
    }
    
    .modal .button-bg {
      border: 2px solid var(--game-color, #55A54A);
      background-color: rgba(var(--game-color-rgb, 85, 165, 74), 0.1);
    }
    
    .modal .button:active {
      transform: scale(0.98);
    }
    
    /* Achtergrondkleuren voor elke sectie */
    #connect-four .section-bg-games {
      background-color: rgba(85, 165, 74, 0.15); /* Groen */
    }
    
    #tic-tac-toe .section-bg-coloring {
      background-color: rgba(240, 124, 62, 0.15); /* Oranje */
    }
    
    #pancake-dobble .section-bg-placemat {
      background-color: rgba(155, 93, 229, 0.15); /* Paars */
    }
    
    /* Aangepaste titelkleuren voor elk spel */
    #connect-four .section-title {
      color: #55A54A;
    }
    
    #tic-tac-toe .section-title {
      color: #F07C3E;
    }
    
    #pancake-dobble .section-title {
      color: #9B5DE5;
    }
    
    /* SVG iconen voor spelknoppen - 3x groter */
    .section {
      position: relative;
      overflow: hidden;
    }
    
    .section svg.game-icon {
      position: absolute;
      right: -20px;
      bottom: -20px;
      width: 180px; /* 3x zo groot */
      height: 180px; /* 3x zo groot */
      opacity: 0.15;
      z-index: 0;
      filter: url(#squiggly-filter); /* Squiggly effect voor game icons */
    }
    
    /* Styling voor de knoppen tekst */
    .modal .button-text {
      color: var(--game-color, #55A54A);
      font-weight: 600;
      font-size: 1.3rem; /* Grotere tekst */
    }
    
    /* SVG ikoon styling in de knoppen */
    .button-svg-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 38px; /* Iets groter */
      height: 38px; /* Iets groter */
    }
    
    .button-svg {
      width: 28px; /* Iets groter */
      height: 28px; /* Iets groter */
      color: var(--game-color, #55A54A);
    }

    /* Animatie voor de popup */
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-content {
      animation: popIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body>
  <!-- SVG filters for hand-drawn effect -->
  <svg class="svg-filters">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie -->
  <div id="top-nav-container"></div>

  <!-- Settings modal container -->
  <div id="settings-modal-container"></div>

  <!-- Hoofdcontent - Spelletjespagina -->
  <div class="app-container">
    <h1 class="page-title">Knof's Spelletjeshoek</h1>
    
    <div class="sections-container">
      <!-- 4 op een rij Section -->
      <div class="section" id="connect-four" data-game-color="#55A54A" data-game-color-rgb="85, 165, 74">
        <div class="section-bg-games"></div>
        <div class="section-title">4 op een rij</div>
        <div class="section-subtitle">Krijg 4 schijfjes op een rij, kolom of diagonaal!</div>
        <span class="section-arrow"></span>
        <!-- Connect Four SVG icon -->
        <svg class="game-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect x="15" y="10" width="70" height="80" rx="3" fill="#2A75BB" fill-opacity="0.7"/>
          <circle cx="25" cy="20" r="7" fill="#55A54A"/>
          <circle cx="45" cy="20" r="7" fill="#FFFFFF"/>
          <circle cx="65" cy="20" r="7" fill="#FFFFFF"/>
          <circle cx="85" cy="20" r="7" fill="#FFFFFF"/>
          <circle cx="25" cy="40" r="7" fill="#FFFFFF"/>
          <circle cx="45" cy="40" r="7" fill="#FFFFFF"/>
          <circle cx="65" cy="40" r="7" fill="#E63946"/>
          <circle cx="85" cy="40" r="7" fill="#FFFFFF"/>
          <circle cx="25" cy="60" r="7" fill="#55A54A"/>
          <circle cx="45" cy="60" r="7" fill="#E63946"/>
          <circle cx="65" cy="60" r="7" fill="#E63946"/>
          <circle cx="85" cy="60" r="7" fill="#FFFFFF"/>
          <circle cx="25" cy="80" r="7" fill="#55A54A"/>
          <circle cx="45" cy="80" r="7" fill="#55A54A"/>
          <circle cx="65" cy="80" r="7" fill="#E63946"/>
          <circle cx="85" cy="80" r="7" fill="#FFFFFF"/>
        </svg>
      </div>
      
      <!-- Boter Kaas en Eieren Section -->
      <div class="section" id="tic-tac-toe" data-game-color="#F07C3E" data-game-color-rgb="240, 124, 62">
        <div class="section-bg-coloring"></div>
        <div class="section-title">Boter, Kaas en Eieren</div>
        <div class="section-subtitle">Krijg drie op een rij om te winnen!</div>
        <span class="section-arrow"></span>
        <!-- Tic Tac Toe SVG icon -->
        <svg class="game-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="10" width="80" height="80" rx="3" fill="#F4F1E4" fill-opacity="0.7"/>
          <line x1="37" y1="10" x2="37" y2="90" stroke="#6B5344" stroke-width="2"/>
          <line x1="63" y1="10" x2="63" y2="90" stroke="#6B5344" stroke-width="2"/>
          <line x1="10" y1="37" x2="90" y2="37" stroke="#6B5344" stroke-width="2"/>
          <line x1="10" y1="63" x2="90" y2="63" stroke="#6B5344" stroke-width="2"/>
          <circle cx="24" cy="24" r="8" stroke="#F07C3E" stroke-width="3" fill="none"/>
          <path d="M76 24 L86 36 M86 24 L76 36" stroke="#55A54A" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="8" stroke="#F07C3E" stroke-width="3" fill="none"/>
          <path d="M24 76 L34 88 M34 76 L24 88" stroke="#55A54A" stroke-width="3" stroke-linecap="round"/>
          <circle cx="76" cy="76" r="8" stroke="#F07C3E" stroke-width="3" fill="none"/>
        </svg>
      </div>

      <!-- Pannenkoeken Dobble Section -->
      <div class="section" id="pancake-dobble" data-game-color="#9B5DE5" data-game-color-rgb="155, 93, 229">
        <div class="section-bg-placemat"></div>
        <div class="section-title">Pannenkoeken Dobble</div>
        <div class="section-subtitle">Vind zo snel mogelijk de overeenkomende plaatjes</div>
        <span class="section-arrow"></span>
        <!-- Pancake Dobble SVG icon -->
        <svg class="game-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="35" cy="50" r="25" fill="#F5DEB3" fill-opacity="0.8" stroke="#D2B48C" stroke-width="2"/>
          <circle cx="75" cy="50" r="25" fill="#F5DEB3" fill-opacity="0.8" stroke="#D2B48C" stroke-width="2"/>
          <!-- Card 1 symbols -->
          <circle cx="25" cy="35" r="5" fill="#FF5733"/>
          <rect x="35" y="35" width="10" height="10" fill="#9B5DE5"/>
          <path d="M25 60 L35 55 L40 65 Z" fill="#55A54A"/>
          <path d="M40 65 L45 55 L50 65 Z" fill="#F07C3E"/>
          <!-- Card 2 symbols -->
          <circle cx="65" cy="35" r="5" fill="#9B5DE5"/>
          <rect x="75" y="35" width="10" height="10" fill="#FF5733"/>
          <path d="M65 60 L75 55 L80 65 Z" fill="#F07C3E"/>
          <path d="M75 70 L85 60 L90 70 Z" fill="#3D85C6"/>
          <!-- Connection line for matching symbol -->
          <line x1="25" y1="35" x2="65" y2="35" stroke="#FF5733" stroke-width="1" stroke-dasharray="2,2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Spelmodus keuze overlay -->
  <div class="modal" id="game-mode-overlay">
    <div class="modal-content" id="game-mode-container">
      <h2 class="modal-title" id="overlay-title">Hoe wil je spelen?</h2>
      <div class="buttons-container">
        <div class="button" id="play-with-knof">
          <div class="button-bg"></div>
          <span>
            <div class="button-svg-container" id="knof-icon">
              <svg class="button-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10s10-4.48 10-10S17.52,2 12,2zM12,6c1.93,0 3.5,1.57 3.5,3.5S13.93,13 12,13s-3.5-1.57 -3.5-3.5S10.07,6 12,6zM12,20c-2.03,0 -4.43,-0.82 -6.14,-2.88C7.55,15.8 9.68,15 12,15s4.45,0.8 6.14,2.12C16.43,19.18 14.03,20 12,20z" fill="currentColor"/>
              </svg>
            </div>
            <div class="button-text" id="knof-title">Spelen tegen Knof</div>
          </span>
        </div>
        <div class="button" id="play-with-friend">
          <div class="button-bg"></div>
          <span>
            <div class="button-svg-container" id="friend-icon">
              <svg class="button-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M16,11c1.66,0 2.99,-1.34 2.99,-3S17.66,5 16,5c-1.66,0 -3,1.34 -3,3s1.34,3 3,3zm-8,0c1.66,0 2.99,-1.34 2.99,-3S9.66,5 8,5C6.34,5 5,6.34 5,8s1.34,3 3,3zm0,2c-2.33,0 -7,1.17 -7,3.5V19h14v-2.5c0,-2.33 -4.67,-3.5 -7,-3.5zm8,0c-0.29,0 -0.62,0.02 -0.97,0.05c1.16,0.84 1.97,1.97 1.97,3.45V19h6v-2.5c0,-2.33 -4.67,-3.5 -7,-3.5z" fill="currentColor"/>
              </svg>
            </div>
            <div class="button-text" id="friend-title">Spelen met een vriend</div>
          </span>
        </div>
      </div>
      <button class="modal-button" id="cancel-game">Terug</button>
    </div>
  </div>

  <!-- Container voor bottom navigatie -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Welkomstbericht voor games pagina
      setTimeout(() => {
        typeSpeechMessage("Welkom bij de spelletjes! Wat wil je spelen? Ik vind ze allemaal leuk!");
      }, 500);
      
      // Variabelen voor de overlay en spel selectie
      const overlay = document.getElementById('game-mode-overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const playWithKnof = document.getElementById('play-with-knof');
      const playWithFriend = document.getElementById('play-with-friend');
      const cancelButton = document.getElementById('cancel-game');
      const containerElement = document.getElementById('game-mode-container');
      
      let selectedGame = '';
      let selectedGameName = '';
      let selectedGameColor = '#55A54A'; // Standaard groen
      let selectedGameColorRGB = '85, 165, 74'; // Standaard groen in RGB
      
      // Functie om de overlay te tonen met juiste kleur
      function showOverlay(gameId, gameName, gameColor, gameColorRGB) {
        selectedGame = gameId;
        selectedGameName = gameName;
        selectedGameColor = gameColor;
        selectedGameColorRGB = gameColorRGB;
        
        // Pas kleuren aan op basis van het gekozen spel
        overlayTitle.style.color = gameColor;
        
        // Update CSS variabelen voor de knoppen
        document.documentElement.style.setProperty('--game-color', gameColor);
        document.documentElement.style.setProperty('--game-color-rgb', gameColorRGB);
        
        // Pas titel aan
        overlayTitle.textContent = `Hoe wil je ${gameName} spelen?`;
        
        // Toon overlay
        overlay.style.display = 'flex';
      }
      
      // Functie om de overlay te verbergen
      function hideOverlay() {
        overlay.style.display = 'none';
      }
      
      // Voeg eventListeners toe voor alle spellen
      const gameItems = document.querySelectorAll('.section');
      
      gameItems.forEach(item => {
        if (item.id === 'connect-four' || item.id === 'tic-tac-toe' || item.id === 'pancake-dobble') {
          item.addEventListener('click', function() {
            const gameId = this.id;
            const gameName = this.querySelector('.section-title').textContent;
            const gameColor = this.dataset.gameColor;
            const gameColorRGB = this.dataset.gameColorRgb;
            
            showOverlay(gameId, gameName, gameColor, gameColorRGB);
            
            // Verschillende berichten per spel
            switch(gameId) {
              case 'connect-four':
                typeSpeechMessage("4 op een rij is superleuk! Wil je tegen mij spelen of tegen een vriend?");
                break;
              case 'tic-tac-toe':
                typeSpeechMessage("Boter, kaas en eieren! Wil je tegen mij spelen of tegen een vriend?");
                break;
              case 'pancake-dobble':
                typeSpeechMessage("Pannenkoeken Dobble is mijn favoriet! Wil je tegen mij spelen of tegen een vriend?");
                break;
            }
          });
        }
      });
      
      // Event listener voor tegen Knof spelen
      playWithKnof.addEventListener('click', () => {
        hideOverlay();
        typeSpeechMessage(`Leuk dat je ${selectedGameName} tegen mij wilt spelen! Ik doe mijn best!`);
        
        // Stuur naar de juiste game pagina met mode parameter
        setTimeout(() => {
          window.location.href = `games/${selectedGame}.html?mode=vs-knof`;
        }, 1500);
      });
      
      // Event listener voor tegen een vriend spelen
      playWithFriend.addEventListener('click', () => {
        hideOverlay();
        typeSpeechMessage(`${selectedGameName} samen spelen is gezellig! Veel plezier!`);
        
        // Stuur naar de juiste game pagina met mode parameter
        setTimeout(() => {
          window.location.href = `games/${selectedGame}.html?mode=vs-friend`;
        }, 1500);
      });
      
      // Event listener voor cancel button
      cancelButton.addEventListener('click', () => {
        hideOverlay();
        typeSpeechMessage("Wil je een ander spelletje kiezen? Ze zijn allemaal leuk!");
      });
    });
  </script>
</body>
</html>
