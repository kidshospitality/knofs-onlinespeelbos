<div class="settings-modal" id="settings-modal">
  <div class="settings-content">
    <span class="close-settings" id="close-settings">&times;</span>
    <h2>Instellingen</h2>
    <p>Hier kun je de instellingen aanpassen.</p>
    <div class="settings-options">
      <div class="settings-option">
        <label for="volume-slider">Geluid</label>
        <input type="range" id="volume-slider" min="0" max="100" value="70">
      </div>
      <div class="settings-option">
        <label for="text-speed">Tekstsnelheid</label>
        <select id="text-speed">
          <option value="slow">Langzaam</option>
          <option value="medium" selected>Gemiddeld</option>
          <option value="fast">Snel</option>
        </select>
      </div>
    </div>
  </div>
</div>
