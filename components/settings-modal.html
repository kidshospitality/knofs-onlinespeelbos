<div class="settings-modal" id="settings-modal">
  <div class="settings-content">
    <span class="close-settings" id="close-settings">&times;</span>
    <h2 data-i18n="settings">Instellingen</h2>
    <div class="settings-options">
      <div class="settings-option">
        <label for="text-speed" data-i18n="text_speed">Tekstsnelheid</label>
        <select id="text-speed">
          <option value="slow" data-i18n="slow">Langzaam</option>
          <option value="medium" selected data-i18n="medium">Gemiddeld</option>
          <option value="fast" data-i18n="fast">Snel</option>
        </select>
      </div>
      <div class="settings-option">
        <label data-i18n="language">Taal</label>
        <div class="language-options">
          <div class="language-option selected" data-lang="nl">🇳🇱 Nederlands</div>
          <div class="language-option" data-lang="de">🇩🇪 Deutsch</div>
          <div class="language-option" data-lang="en">🇬🇧 English</div>
        </div>
      </div>
    </div>
  </div>
</div>
