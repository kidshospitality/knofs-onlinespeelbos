<!DOCTYPE html>
<html lang="nl">
<head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-685BXDXHF8"></script>
<script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title data-i18n="chat_page_title">Praten met Knof - Knof's Speelbos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
    /* Reset - iOS Safari Fix */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
      background-color: transparent !important;
    }
    
    /* Custom viewport height variable voor betere iOS ondersteuning */
    :root {
      --vh: 1vh;
    }
    
    /* App container - Volledig scherm */
    .app-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 65px; /* Verhoogd voor betere spacing */
      display: flex;
      flex-direction: column;
      background-color: transparent !important;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      height: calc(100% - 65px); /* Aangepast */
      margin: 0 !important; /* Verwijder eventuele marges */
      padding: 0 !important; /* Verwijder eventuele padding */
    }
    
    /* Style voor de chatbot container */
    .chatbot-wrapper {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-color: transparent !important;
      display: flex;
      flex-direction: column;
      border: none !important; /* Verwijder alle borders */
      padding-bottom: 30px !important;
    }
    
    /* Bottom navigation fix */
    #bottom-nav-container {
      flex-shrink: 0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 999; /* Hogere z-index */
      height: 50px;
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    
    /* Top navigation volledig verbergen */
    #top-nav-container {
      display: none !important;
      height: 0 !important;
      position: absolute !important;
      visibility: hidden !important;
      z-index: -999 !important;
      pointer-events: none !important;
    }
    
    /* SVG filters niet laten storen */
    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }
    
    /* Extra ruimte boven de onderste navigatiebalk - buffer zone */
    .bottom-buffer-zone {
      position: fixed;
      bottom: 50px;
      left: 0;
      right: 0;
      height: 20px; /* Verhoogd van 15px naar 20px */
      background-color: transparent;
      z-index: 990; /* Net onder de navigatiebalk maar boven chatbot */
      pointer-events: none; /* Zodat het niet interactief is */
    }
    
    /* Nieuwe Pickaxe chatbot stijl met dezelfde eigenschappen als het origineel */
    #deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d {
      width: 100%;
      height: 100%;
      position: relative;
      display: block;
      border: none !important; /* Verwijder alle borders */
    }
    
    /* Zorg ervoor dat de volledige iframe de juiste grootte heeft */
    #deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d iframe {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
    }
    
    /* Overschrijf de chat-container stijlen uit style.css */
    .chat-container {
      border: none !important;
      filter: none !important;
      box-shadow: none !important;
      background-color: transparent !important;
    }
    
    /* Verwijder alle randen van Pickaxe elementen */
    #deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d * {
      border: none !important;
      box-shadow: none !important;
    }
    
    /* Verberg eventuele andere borders in geneste elementen */
    .app-container * {
      border: none !important;
    }
    
    /* Gebruik negatieve CSS-reset voor borders in de chatbot */
    [class*="chat"], [class*="message"], [class*="bubble"], 
    [class*="container"], [class*="panel"], [class*="box"], 
    [class*="input"], [class*="wrapper"] {
      border: none !important;
      box-shadow: none !important;
    }
    
    /* Verhoog de positie van het inputveld */
    [class*="pickaxe-input-container"],
    [class*="input-container"],
    [class*="message-input-container"],
    [class*="textarea-container"],
    [id*="input-container"] {
      margin-bottom: 15px !important; /* Verhoog deze waarde om het inputveld verder omhoog te duwen */
      position: relative !important;
      bottom: 20px !important; /* Verhoog deze waarde om het inputveld verder omhoog te duwen */
      padding-bottom: 10px !important;
    }
    
    /* Zorg ervoor dat de verstuurknop ook mee omhoog gaat */
    [class*="send-button"],
    [class*="submit-button"],
    button[type="submit"] {
      position: relative !important;
      bottom: 20px !important; /* Zelfde waarde als hierboven */
    }
    
    /* Stijl voor de Pickaxe iframe om volledige grootte te garanderen */
    iframe {
      border: none !important;
      background: transparent !important;
      width: 100% !important;
      height: 100% !important;
    }
    
    /* Zorg ervoor dat Pickaxe goed schaalt in het container element */
    [class*="pickaxe-chat"], 
    [class*="pickaxe-container"],
    [class*="pickaxe-wrapper"] {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      position: relative !important;
    }
    
    /* Laadanimatie stijl */
    #chat-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #F8F6E9;
      z-index: 100;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #70B578;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- SVG filters for hand-drawn effect -->
  <svg class="svg-filters">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie (nu verborgen) -->
  <div id="top-nav-container"></div>

  <!-- Settings modal container -->
  <div id="settings-modal-container"></div>

  <!-- Hoofdcontent - Chat met Pickaxe chatbot -->
  <div class="app-container">
    <div id="chatbot-wrapper" class="chatbot-wrapper">
      <!-- Laadanimatie voor de chatbot -->
      <div id="chat-loading">
        <div class="loading-spinner"></div>
        <p data-i18n="loading_chat">Knof wordt wakker...</p>
      </div>
      
      <!-- Nieuwe Pickaxe chatbot embed code -->
      <div id="deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d"></div>
    </div>
  </div>

  <!-- Extra buffer zone boven de bottom nav -->
  <div class="bottom-buffer-zone"></div>

  <!-- Container voor bottom navigatie - hoge z-index -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  
  <!-- Extra script om top-nav te verbergen en maximale ruimte voor chat -->
  <script>
    // Zorg ervoor dat de top-nav echt verborgen blijft, zelfs als common.js deze probeert te laden
    document.addEventListener('DOMContentLoaded', function() {
      // iOS viewpoorthoogte fix
      function setViewportHeight() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      
      // Pas viewport hoogte aan bij laden en resize
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', function() {
        setTimeout(setViewportHeight, 300);
      });
      
      // Verberg top-nav met dwingende stijlen
      function forceHideTopNav() {
        const topNav = document.getElementById('top-nav-container');
        if (topNav) {
          topNav.style.cssText = `
            display: none !important;
            height: 0 !important;
            visibility: hidden !important;
            opacity: 0 !important;
            position: absolute !important;
            z-index: -999 !important;
            pointer-events: none !important;
            width: 0 !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
          `;
          
          // Verwijder eventuele inhoud
          topNav.innerHTML = '';
        }
        
        // Forceer app-container om vanaf bovenkant te beginnen
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
          appContainer.style.top = '0';
          appContainer.style.paddingTop = '0';
          appContainer.style.marginTop = '0';
        }
        
        // Forceer bottom nav zichtbaarheid
        const bottomNav = document.getElementById('bottom-nav-container');
        if (bottomNav) {
          bottomNav.style.cssText = `
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 999 !important;
            height: 50px !important;
          `;
        }
      }
      
      // Fix voor iframe schaling binnen Pickaxe
      function fixIframeScaling() {
        // Zoek naar iframes binnen de Pickaxe container
        const pickaxeContainer = document.getElementById('deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d');
        if (pickaxeContainer) {
          // Zorg ervoor dat de container zelf de juiste afmetingen heeft
          pickaxeContainer.style.width = '100%';
          pickaxeContainer.style.height = '100%';
          pickaxeContainer.style.position = 'absolute';
          pickaxeContainer.style.top = '0';
          pickaxeContainer.style.left = '0';
          pickaxeContainer.style.right = '0';
          pickaxeContainer.style.bottom = '0';
          
          // Zoek naar iframes en pas hun stijl aan
          const iframes = pickaxeContainer.querySelectorAll('iframe');
          iframes.forEach(iframe => {
            iframe.style.cssText = `
              width: 100% !important;
              height: 100% !important;
              position: absolute !important;
              top: 0 !important;
              left: 0 !important;
              right: 0 !important;
              bottom: 0 !important;
              border: none !important;
              background: transparent !important;
            `;
          });
          
          // Zoek naar andere container elementen binnen Pickaxe
          const containers = pickaxeContainer.querySelectorAll('[class*="container"], [class*="wrapper"], [class*="chat"]');
          containers.forEach(container => {
            container.style.width = '100%';
            container.style.height = '100%';
            container.style.maxWidth = '100%';
            container.style.maxHeight = '100%';
            container.style.position = 'relative';
          });
        }
      }
      
      // Verwijder alle randen van chatinterface elementen
      function removeBorders() {
        // Direct op pickaxe container
        const pickaxeContainer = document.getElementById('deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d');
        if (pickaxeContainer) {
          pickaxeContainer.style.border = 'none';
          pickaxeContainer.style.boxShadow = 'none';
          pickaxeContainer.style.borderRadius = '0';
        }
        
        // Zoek alle elementen die mogelijk borders hebben
        const borderElements = document.querySelectorAll('[class*="chat"], [class*="message"], [class*="bubble"], [class*="container"], [class*="panel"], [class*="box"], [class*="input"], [class*="wrapper"]');
        borderElements.forEach(element => {
          element.style.border = 'none';
          element.style.boxShadow = 'none';
        });

        // Extra: vertaal eventuele placeholder teksten of knoppen in de chatinterface
        translateChatElements();
        
        // Fix iframe schaling
        fixIframeScaling();
      }

      // Functie om vertaling toe te passen op dynamische chatbot elementen
      function translateChatElements() {
        // Probeer eventuele inputvelden te vinden en vertaal de placeholder
        const inputFields = document.querySelectorAll('[placeholder], [aria-placeholder]');
        inputFields.forEach(input => {
          // Alleen als de taal niet Nederlands is (standaard)
          const currentLang = localStorage.getItem('language') || 'nl';
          if (currentLang !== 'nl') {
            const placeholder = input.getAttribute('placeholder') || input.getAttribute('aria-placeholder');
            if (placeholder && placeholder.includes('Typ een bericht')) {
              if (currentLang === 'en') {
                input.setAttribute('placeholder', 'Type a message...');
                if (input.hasAttribute('aria-placeholder')) {
                  input.setAttribute('aria-placeholder', 'Type a message...');
                }
              } else if (currentLang === 'de') {
                input.setAttribute('placeholder', 'Nachricht eingeben...');
                if (input.hasAttribute('aria-placeholder')) {
                  input.setAttribute('aria-placeholder', 'Nachricht eingeben...');
                }
              }
            }
          }
        });

        // Probeer de verzendknop te vinden en te vertalen
        const sendButtons = document.querySelectorAll('button[type="submit"], [class*="send-button"]');
        sendButtons.forEach(button => {
          const currentLang = localStorage.getItem('language') || 'nl';
          if (currentLang !== 'nl') {
            // Controleer op 'Verstuur' tekst
            if (button.textContent.includes('Verstuur') || button.textContent.includes('Verzenden')) {
              if (currentLang === 'en') {
                button.textContent = 'Send';
              } else if (currentLang === 'de') {
                button.textContent = 'Senden';
              }
            }
          }
        });
      }
      
      // Controleer of Pickaxe is geladen en verberg de laadanimatie
      function checkPickaxeLoaded() {
        // Check of er elementen binnen de container zijn toegevoegd
        const pickaxeContainer = document.getElementById('deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d');
        
        if (pickaxeContainer && (
            pickaxeContainer.children.length > 0 || 
            pickaxeContainer.innerHTML.trim() !== '' ||
            document.querySelector('iframe[src*="pickaxe"], iframe[src*="studio"]')
        )) {
          const loader = document.getElementById('chat-loading');
          if (loader) loader.style.display = 'none';
          
          // Fix schaling als iframe aanwezig is
          fixIframeScaling();
          return true;
        }
        
        return false;
      }
      
      // Fix voor schaal problemen na het laden
      function resizeObserver() {
        // Observeer size veranderingen van het chatbot element
        if ('ResizeObserver' in window) {
          const container = document.getElementById('deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d');
          if (container) {
            const observer = new ResizeObserver(entries => {
              // Bij elke resize, fix de iframe schaling
              fixIframeScaling();
            });
            observer.observe(container);
          }
        }
      }

      // Handmatige timeout om laadanimatie te verbergen na een bepaalde tijd (als fallback)
      setTimeout(function() {
        const loader = document.getElementById('chat-loading');
        if (loader) {
          loader.style.display = 'none';
        }
        
        // Ook de iframe schaling proberen te fixen
        fixIframeScaling();
      }, 5000); // Verberg na 5 seconden, ongeacht of de chatbot geladen is

      // Voer direct uit en blijf controleren
      forceHideTopNav();
      setInterval(forceHideTopNav, 1000);
      
      // Wacht tot Pickaxe is geladen en verwijder dan borders
      setTimeout(removeBorders, 1000);
      setInterval(removeBorders, 2000); // Blijf controleren op nieuwe elementen
      setTimeout(fixIframeScaling, 1500); // Extra poging voor iframe scaling

      // Controleer regelmatig of Pickaxe is geladen
      const loadCheckInterval = setInterval(() => {
        if (checkPickaxeLoaded()) {
          clearInterval(loadCheckInterval);
          // Extra fix voor iframe nadat het geladen is
          setTimeout(fixIframeScaling, 300);
          // Zet resize observer op
          resizeObserver();
        }
      }, 500);

      // Luister naar eventuele taalwijzigingen
      window.addEventListener('languageChanged', function(e) {
        translateChatElements();
      });
      
      // Fix na volledig laden van de pagina
      window.addEventListener('load', function() {
        setTimeout(fixIframeScaling, 1000);
        // Zet de chatbot container op volledige grootte
        const container = document.getElementById('deployment-a054c575-d95c-4767-8bd7-5bf82efb6b2d');
        if (container) {
          container.style.cssText = `
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
          `;
        }
      });
    });
  </script>
  
  <!-- Nieuwe Pickaxe Chatbot Script -->
  <script src="https://studio.pickaxe.co/api/embed/bundle.js"></script>
</body>
</html>
