<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Praten met Knof - Knof's Speelbos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
    /* Reset - iOS Safari Fix */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
      background-color: transparent !important;
    }
    
    /* App container - Full height layout zonder padding-top */
    .app-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 50px; /* Alleen ruimte voor de bottom-nav */
      display: flex;
      flex-direction: column;
      -webkit-transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      background-color: transparent !important;
      padding-top: 0; /* Geen ruimte voor top-nav */
      padding-bottom: 0; /* We gebruiken bottom property hierboven in plaats van padding */
    }
    
    /* Style voor de chatbot container */
    .chatbot-wrapper {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-color: transparent !important;
    }
    
    /* Laad-indicator styles */
    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      font-family: 'Patrick Hand';
      color: #55A54A;
    }
    
    /* Bottom navigation fix */
    #bottom-nav-container {
      flex-shrink: 0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 50px;
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    
    /* Top navigation verbergen */
    #top-nav-container {
      display: none !important; /* Verberg de top navigatie */
      height: 0 !important;
      position: absolute !important;
      visibility: hidden !important;
      z-index: -1 !important;
    }
    
    /* SVG filters niet laten storen */
    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }
    
    /* Safari specifieke fix voor iOS devices */
    @supports (-webkit-touch-callout: none) {
      .app-container {
        height: -webkit-fill-available;
      }
    }
  </style>
</head>
<body>
  <!-- SVG filters for hand-drawn effect -->
  <svg class="svg-filters">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie (nu verborgen) -->
  <div id="top-nav-container"></div>

  <!-- Settings modal container -->
  <div id="settings-modal-container"></div>

  <!-- Hoofdcontent - Chat met iframe -->
  <div class="app-container">
    <div id="chatbot-wrapper" class="chatbot-wrapper">
      <div id="loading-indicator" class="loading-indicator">Laden...</div>
    </div>
  </div>

  <!-- Container voor bottom navigatie -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  
  <!-- Extra script om top-nav te verbergen en maximale ruimte voor chat -->
  <script>
    // Zorg ervoor dat de top-nav echt verborgen blijft, zelfs als common.js deze probeert te laden
    document.addEventListener('DOMContentLoaded', function() {
      // Verberg top-nav direct
      const topNav = document.getElementById('top-nav-container');
      if (topNav) {
        topNav.style.display = 'none';
        topNav.style.height = '0';
        topNav.style.visibility = 'hidden';
        topNav.style.opacity = '0';
        topNav.style.position = 'absolute';
        topNav.style.zIndex = '-1';
      }
      
      // Blijf controleren of topNav verborgen blijft (voor het geval common.js het weer weergeeft)
      const keepTopNavHidden = setInterval(function() {
        if (topNav) {
          topNav.style.display = 'none';
          topNav.style.height = '0';
          topNav.style.visibility = 'hidden';
          topNav.style.opacity = '0';
          topNav.style.position = 'absolute';
          topNav.style.zIndex = '-1';
        }
      }, 300);
      
      // Zorg dat de app container vanaf de bovenkant begint
      const appContainer = document.querySelector('.app-container');
      if (appContainer) {
        appContainer.style.top = '0';
        appContainer.style.paddingTop = '0';
      }
      
      // Fix voor iOS hoogte berekening
      function setViewportHeight() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      
      // Pas viewport hoogte aan bij laden en resize
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', function() {
        setTimeout(setViewportHeight, 300);
      });
    });
  </script>
  
  <!-- Chatbot scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const chatbotWrapper = document.getElementById('chatbot-wrapper');
      const loadingIndicator = document.getElementById('loading-indicator');
      
      // Laad de chatbot script
      const script = document.createElement('script');
      script.id = "d5595c66-85ed-46ca-9a20-7e4988fb0618";
      script.setAttribute('data-company-id', "477718fd-e50b-4758-8fcb-7709dedf75ec");
      script.setAttribute('data-product-name', "alias:aichat");
      script.setAttribute('data-product-iframe', "create");
      script.src = "https://fcdn.servicehoster.io/iframe.product.js";
      
      // Wanneer script geladen is
      script.onload = function() {
        setTimeout(function() {
          // Verberg loader
          loadingIndicator.style.display = 'none';
          
          // Pas iframe aan en maak transparant
          setupIframe();
        }, 500);
      };
      
      chatbotWrapper.appendChild(script);
      
      // Functie om iframe te setuppen en transparant te maken
      function setupIframe() {
        const iframe = chatbotWrapper.querySelector('iframe');
        if (!iframe) return;
          
        // Maak iframe zelf transparant en full-size
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.position = 'absolute';
        iframe.style.top = '0';
        iframe.style.left = '0';
        iframe.style.border = 'none';
        iframe.style.backgroundColor = 'transparent';
        
        // Injecteer CSS om iframe inhoud transparant te maken
        try {
          // Deze methode werkt alleen als het iframe dezelfde origin heeft
          injectTransparentCSS(iframe);
        } catch(e) {
          console.log("Directe CSS injectie niet mogelijk");
        }
        
        // Plan B: Voeg transparante stijl toe via iframe.onload
        iframe.onload = function() {
          setTimeout(function() {
            try {
              injectTransparentCSS(iframe);
            } catch(e) {
              console.log("Onload CSS injectie niet mogelijk");
            }
          }, 100);
        };
      }
      
      // Functie om transparantie CSS in te injecteren in iframe
      function injectTransparentCSS(iframe) {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (!iframeDoc) return;
        
        // Creëer een stijl element
        const style = document.createElement('style');
        style.textContent = `
          html, body, div, main, section, article, 
          .container, .wrapper, .content, .main, 
          .chat-container, .message-container, .chat-wrapper,
          [class*="container"], [class*="wrapper"], [class*="content"],
          [class*="background"], [class*="bg"] {
            background-color: transparent !important;
            background-image: none !important;
          }
          
          /* Start vanaf de bovenkant, geen padding */
          html, body, .container, .main {
            padding-top: 0 !important;
            margin-top: 0 !important;
          }
          
          /* Lichte achtergrond voor berichten zodat ze leesbaar blijven */
          .message, .chat-message, .user-message, .bot-message,
          .message-bubble, [class*="message"], [class*="bubble"] {
            background-color: rgba(255, 255, 255, 0.6) !important;
          }
          
          /* Extra ruimte voor invoerveld (indien nodig) */
          .input-container, .message-input, .chat-input, 
          [class*="input-container"], [class*="input-wrapper"] {
            margin-bottom: 50px !important; /* Ruimte voor bottom nav */
          }
        `;
        
        // Voeg stijl toe aan iframe document
        iframeDoc.head.appendChild(style);
        
        // Extra: probeer ook inline achtergronden te verwijderen
        const allElements = iframeDoc.querySelectorAll('*');
        allElements.forEach(el => {
          el.style.backgroundColor = 'transparent';
          el.style.backgroundImage = 'none';
        });
      }
      
      // Monitor en fix iframe regelmatig
      function monitorIframe() {
        const iframe = chatbotWrapper.querySelector('iframe');
        if (iframe) {
          setupIframe();
        }
      }
      
      // Controleer regelmatig of het iframe bestaat en maak het transparant
      setInterval(monitorIframe, 1000);
      
      // Extra checks na verschillende intervallen
      setTimeout(monitorIframe, 500);
      setTimeout(monitorIframe, 1500);
      setTimeout(monitorIframe, 3000);
      
      // Extra fixes voor iOS
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
        // Zorg dat bottom nav altijd zichtbaar blijft
        setInterval(function() {
          const bottomNav = document.getElementById('bottom-nav-container');
          if (bottomNav) {
            bottomNav.style.display = 'flex';
            bottomNav.style.visibility = 'visible';
            bottomNav.style.opacity = '1';
          }
        }, 500);
      }
    });
  </script>
</body>
</html>
