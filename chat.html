<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Praten met Knof - Knof's Speelbos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
    /* Reset - iOS Safari Fix */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
      background-color: transparent !important;
    }
    
    /* Custom viewport height variable voor betere iOS ondersteuning */
    :root {
      --vh: 1vh;
    }
    
    /* App container - 10px omhoog geschoven */
    .app-container {
      position: absolute;
      top: -10px; /* Verschuif 10px omhoog */
      left: 0;
      right: 0;
      bottom: 40px; /* 50px - 10px omhoog = 40px */
      display: flex;
      flex-direction: column;
      background-color: transparent !important;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      height: calc(100% - 40px); /* Aangepast voor 10px verschuiving */
      height: calc(calc(var(--vh, 1vh) * 100) - 40px); /* Voor iOS */
      padding-top: 10px; /* Compensatie voor inhoud */
    }
    
    /* Style voor de chatbot container */
    .chatbot-wrapper {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-color: transparent !important;
      display: flex;
      flex-direction: column;
      margin-top: -10px; /* Extra correctie */
    }
    
    /* Laad-indicator styles */
    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      font-family: 'Patrick Hand';
      color: #55A54A;
    }
    
    /* Bottom navigation fix */
    #bottom-nav-container {
      flex-shrink: 0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 999; /* Hogere z-index */
      height: 50px;
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    
    /* Top navigation volledig verbergen */
    #top-nav-container {
      display: none !important;
      height: 0 !important;
      position: absolute !important;
      visibility: hidden !important;
      z-index: -999 !important;
      pointer-events: none !important;
    }
    
    /* SVG filters niet laten storen */
    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }
    
    /* Zorg dat iframe volledig vult en 10px omhoog staat */
    iframe {
      width: 100% !important;
      height: calc(100% + 10px) !important; /* Extra 10px hoogte */
      position: absolute !important;
      top: -10px !important; /* 10px omhoog */
      left: 0 !important;
      border: none !important;
      background-color: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    
    /* Extra ruimte boven de onderste navigatiebalk */
    .bottom-buffer-zone {
      position: fixed;
      bottom: 50px;
      left: 0;
      right: 0;
      height: 20px; /* Grotere buffer */
      background-color: transparent;
      z-index: 990;
      pointer-events: none;
    }
    
    /* Safari specifieke fix voor iOS devices */
    @supports (-webkit-touch-callout: none) {
      body, html {
        height: -webkit-fill-available;
      }
      .app-container {
        height: calc(-webkit-fill-available - 40px); /* Aangepast */
      }
    }
  </style>
</head>
<body>
  <!-- SVG filters for hand-drawn effect -->
  <svg class="svg-filters">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie (nu verborgen) -->
  <div id="top-nav-container"></div>

  <!-- Settings modal container -->
  <div id="settings-modal-container"></div>

  <!-- Hoofdcontent - Chat met iframe -->
  <div class="app-container">
    <div id="chatbot-wrapper" class="chatbot-wrapper">
      <div id="loading-indicator" class="loading-indicator">Laden...</div>
    </div>
  </div>

  <!-- Extra buffer zone boven de bottom nav -->
  <div class="bottom-buffer-zone"></div>

  <!-- Container voor bottom navigatie - hoge z-index -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  
  <!-- Extra script om top-nav te verbergen en maximale ruimte voor chat -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // iOS viewpoorthoogte fix
      function setViewportHeight() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
        
        // Force redraw
        document.body.style.display = 'none';
        document.body.offsetHeight; // Trigger reflow
        document.body.style.display = '';
      }
      
      // Pas viewport hoogte aan bij laden en resize
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', function() {
        setTimeout(setViewportHeight, 100);
        setTimeout(setViewportHeight, 300);
        setTimeout(setViewportHeight, 500);
      });
      
      // Verberg top-nav met dwingende stijlen
      function forceHideTopNav() {
        const topNav = document.getElementById('top-nav-container');
        if (topNav) {
          topNav.style.cssText = `
            display: none !important;
            height: 0 !important;
            visibility: hidden !important;
            opacity: 0 !important;
            position: absolute !important;
            z-index: -999 !important;
            pointer-events: none !important;
            width: 0 !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
          `;
          
          // Verwijder eventuele inhoud
          topNav.innerHTML = '';
        }
        
        // Forceer app-container om vanaf bovenkant te beginnen
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
          appContainer.style.top = '-10px'; // 10px omhoog
          appContainer.style.paddingTop = '10px'; // Compensatie
          appContainer.style.marginTop = '0';
        }
        
        // Forceer bottom nav zichtbaarheid
        const bottomNav = document.getElementById('bottom-nav-container');
        if (bottomNav) {
          bottomNav.style.cssText = `
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 999 !important;
            height: 50px !important;
          `;
        }
      }
      
      // Voer direct uit en blijf controleren
      forceHideTopNav();
      
      // Forceer de stijlen elke 100ms gedurende 5 seconden
      let checkCount = 0;
      const interval = setInterval(function() {
        forceHideTopNav();
        checkCount++;
        if (checkCount > 50) clearInterval(interval);
      }, 100);
      
      // Blijf periodiek controleren
      setInterval(forceHideTopNav, 1000);
    });
  </script>
  
  <!-- Chatbot scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const chatbotWrapper = document.getElementById('chatbot-wrapper');
      const loadingIndicator = document.getElementById('loading-indicator');
      
      // Laad de chatbot script
      const script = document.createElement('script');
      script.id = "d5595c66-85ed-46ca-9a20-7e4988fb0618";
      script.setAttribute('data-company-id', "477718fd-e50b-4758-8fcb-7709dedf75ec");
      script.setAttribute('data-product-name', "alias:aichat");
      script.setAttribute('data-product-iframe', "create");
      script.src = "https://fcdn.servicehoster.io/iframe.product.js";
      
      // Wanneer script geladen is
      script.onload = function() {
        setTimeout(function() {
          // Verberg loader
          if (loadingIndicator) loadingIndicator.style.display = 'none';
          
          // Pas iframe aan
          setupIframe();
        }, 500);
      };
      
      chatbotWrapper.appendChild(script);
      
      // Functie om iframe te setuppen en transparant te maken
      function setupIframe() {
        const iframe = chatbotWrapper.querySelector('iframe');
        if (!iframe) return;
          
        // Maak iframe zelf transparant en full-size met dwingender stijlen
        iframe.style.cssText = `
          width: 100% !important;
          height: calc(100% + 10px) !important;
          position: absolute !important;
          top: -10px !important;
          left: 0 !important;
          right: 0 !important;
          bottom: 0 !important;
          border: none !important;
          background-color: transparent !important;
          margin: 0 !important;
          padding: 0 !important;
          display: block !important;
          overflow: hidden !important;
        `;
        
        // Probeer CSS te injecteren (kan mislukken bij cross-origin)
        try {
          injectTransparentCSS(iframe);
        } catch(e) {
          console.log("Directe CSS injectie niet mogelijk:", e);
        }
        
        // Plan B: Onload event voor CSS injectie
        iframe.onload = function() {
          try {
            injectTransparentCSS(iframe);
          } catch(e) {
            console.log("Onload CSS injectie niet mogelijk:", e);
          }
          
          // Voor betere iOS ondersteuning
          if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
            setTimeout(function() {
              injectTransparentCSS(iframe);
            }, 500);
          }
        };
      }
      
      // Functie om transparantie CSS in te injecteren in iframe
      function injectTransparentCSS(iframe) {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (!iframeDoc) return;
        
        // Creëer een stijl element
        const style = document.createElement('style');
        style.textContent = `
          /* Basis elementen transparant maken */
          html, body, div, main, section, article, 
          .container, .wrapper, .content, .main, 
          .chat-container, .message-container, .chat-wrapper,
          [class*="container"], [class*="wrapper"], [class*="content"],
          [class*="background"], [class*="bg"], header, footer {
            background-color: transparent !important;
            background-image: none !important;
          }
          
          /* Haal padding en margin weg van belangrijke elementen */
          html, body, .container, .main, .chat-container {
            padding-top: 0 !important;
            margin-top: 0 !important;
            height: 100% !important;
            max-height: 100% !important;
            overflow-y: auto !important;
          }
          
          /* Zorg dat berichten leesbaar blijven */
          .message, .chat-message, .user-message, .bot-message,
          .message-bubble, [class*="message"], [class*="bubble"] {
            background-color: rgba(255, 255, 255, 0.75) !important;
            border: 1px solid rgba(200, 200, 200, 0.5) !important;
          }
          
          /* Extra ruimte onderin voor de bottom nav - VERHOOGD */
          .input-container, .message-input, .chat-input, 
          [class*="input-container"], [class*="input-wrapper"],
          [class*="footer"], footer, .chat-footer {
            padding-bottom: 80px !important; /* Verhoogd naar 80px */
            margin-bottom: 70px !important; /* Verhoogd naar 70px */
            position: relative !important;
            z-index: 1 !important;
          }
          
          /* Verberg headers of andere potentieel problematische elementen */
          header, .header, [class*="header"], .toolbar, .navbar, .nav-bar {
            display: none !important;
            height: 0 !important;
            visibility: hidden !important;
            opacity: 0 !important;
            position: absolute !important;
            pointer-events: none !important;
          }
          
          /* Volledige scrol-container max-height fix */
          .messages-container, .chat-messages, [class*="messages-container"],
          [class*="message-list"], .message-list, .chat-body {
            max-height: none !important;
            height: auto !important;
            flex: 1 !important;
            padding-bottom: 130px !important; /* Verhoogd naar 130px */
          }
          
          /* Specifiek voor input velden - extra ruimte aan de onderkant */
          textarea, input[type="text"], .message-input, [class*="text-input"],
          .text-field, [class*="text-field"], .input, [class*="input-field"] {
            margin-bottom: 25px !important; /* Verhoogd naar 25px */
          }
          
          /* Verzend knop ook omhoog brengen */
          .send-button, [class*="send-button"], button[type="submit"],
          [class*="submit-button"], .submit {
            margin-bottom: 25px !important; /* Verhoogd naar 25px */
          }
          
          /* Extra ruimte onderaan - nieuwe toevoeging */
          form, [class*="form"], .input-form, .chat-form {
            padding-bottom: 25px !important;
            margin-bottom: 25px !important;
          }
          
          /* Bottom-bar of footer positionering verbeteren */
          .bottom-bar, [class*="bottom-bar"], .chat-bottom-bar {
            position: relative !important;
            bottom: 25px !important;
            margin-bottom: 25px !important;
          }
        `;
        
        // Voeg stijl toe aan iframe document
        iframeDoc.head.appendChild(style);
        
        // Verwijder inline achtergronden van alle elementen
        setTimeout(function() {
          try {
            const allElements = iframeDoc.querySelectorAll('*');
            allElements.forEach(el => {
              el.style.backgroundColor = 'transparent';
              el.style.backgroundImage = 'none';
              
              // Extra padding voor mogelijke invoervelden
              if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || 
                  (el.className && (
                    el.className.includes('input') || 
                    el.className.includes('text-field') || 
                    el.className.includes('message-input')
                  ))) {
                el.style.marginBottom = '25px';
              }
              
              // Probeer input container te identificeren en extra ruimte toe te voegen
              if (el.className && (
                  el.className.includes('input-container') || 
                  el.className.includes('footer') || 
                  el.className.includes('bottom'))) {
                el.style.paddingBottom = '80px';
                el.style.marginBottom = '70px';
              }
              
              // Extra voor form-achtige elementen
              if (el.tagName === 'FORM' || 
                  (el.className && (
                    el.className.includes('form') || 
                    el.className.includes('input-form')
                  ))) {
                el.style.paddingBottom = '25px';
                el.style.marginBottom = '25px';
              }
            });
          } catch(e) {
            console.log("Inline style removing failed:", e);
          }
        }, 100);
      }
      
      // Monitor en fix iframe regelmatig
      function monitorIframe() {
        const iframe = chatbotWrapper.querySelector('iframe');
        if (iframe) {
          setupIframe();
        }
      }
      
      // Controleer regelmatig of het iframe bestaat en fix het
      setInterval(monitorIframe, 2000);
      
      // Extra checks na verschillende intervallen
      setTimeout(monitorIframe, 500);
      setTimeout(monitorIframe, 1500);
      setTimeout(monitorIframe, 3000);
      
      // Extra fixes voor iOS
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
        // Zorg dat bottom nav altijd zichtbaar blijft
        setInterval(function() {
          const bottomNav = document.getElementById('bottom-nav-container');
          if (bottomNav) {
            bottomNav.style.display = 'flex';
            bottomNav.style.visibility = 'visible';
            bottomNav.style.opacity = '1';
            bottomNav.style.zIndex = '999';
          }
        }, 500);
      }
    });
  </script>
</body>
</html>
