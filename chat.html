<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Praten met Knof - Knof's Speelbos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
    /* Reset - iOS Safari Fix */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      background-color: transparent !important;
    }
    
    /* App container - Full height layout */
    .app-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      background-color: transparent !important;
      /* Verwijder padding-top zodat chat volledig tot bovenaan loopt */
      padding-top: 0; 
      padding-bottom: 50px; /* Ruimte voor bottom-nav */
    }
    
    /* Style voor de chatbot container */
    .chatbot-wrapper {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-color: transparent !important;
      /* Zorg dat deze container de volledige beschikbare ruimte gebruikt */
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
    }
    
    /* Laad-indicator styles */
    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      font-family: 'Patrick Hand';
      color: #55A54A;
    }
    
    /* Bottom navigation fix */
    #bottom-nav-container {
      flex-shrink: 0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 50px;
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
    
    /* Top navigation fix */
    /* Verplaatst naar inline in de iframe om zichtbaarheid te garanderen */
    #top-nav-container {
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9; /* Onder 10 zodat chat controls zichtbaar blijven */
      height: 60px;
      pointer-events: none; /* Laat events door naar de chat */
    }
    
    /* Top navigation items moeten klikbaar zijn */
    #top-nav-container a, #top-nav-container button {
      pointer-events: auto;
    }
    
    /* Force iframe to take full height */
    iframe {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      background-color: transparent !important;
    }
  </style>
</head>
<body>
  <!-- SVG filters for hand-drawn effect -->
  <svg class="svg-filters" style="display:none;">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie -->
  <div id="top-nav-container"></div>

  <!-- Hoofdcontent - Chat met iframe -->
  <div class="app-container">
    <div id="chatbot-wrapper" class="chatbot-wrapper">
      <div id="loading-indicator" class="loading-indicator">Laden...</div>
    </div>
  </div>

  <!-- Container voor bottom navigatie -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  
  <!-- Chatbot scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const chatbotWrapper = document.getElementById('chatbot-wrapper');
      const loadingIndicator = document.getElementById('loading-indicator');
      
      // Zorg dat de app-container de volledige hoogte gebruikt
      function adjustAppContainer() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
        
        // Force full height met CSS variabele
        document.querySelector('.app-container').style.height = `calc(100 * var(--vh, 1vh))`;
        document.querySelector('.chatbot-wrapper').style.height = `calc(100 * var(--vh, 1vh) - 50px)`;
      }
      
      // Pas container hoogte aan bij laden en resize
      adjustAppContainer();
      window.addEventListener('resize', adjustAppContainer);
      window.addEventListener('orientationchange', function() {
        setTimeout(adjustAppContainer, 300);
      });
      
      // Laad de chatbot script
      const script = document.createElement('script');
      script.id = "d5595c66-85ed-46ca-9a20-7e4988fb0618";
      script.setAttribute('data-company-id', "477718fd-e50b-4758-8fcb-7709dedf75ec");
      script.setAttribute('data-product-name', "alias:aichat");
      script.setAttribute('data-product-iframe', "create");
      script.src = "https://fcdn.servicehoster.io/iframe.product.js";
      
      // Wanneer script geladen is
      script.onload = function() {
        setTimeout(function() {
          // Verberg loader
          loadingIndicator.style.display = 'none';
          
          // Zoek en configureer iframe
          const iframeSetupInterval = setInterval(function() {
            const iframe = chatbotWrapper.querySelector('iframe');
            if (iframe) {
              // Stop zoeken als iframe gevonden is
              clearInterval(iframeSetupInterval);
              
              // Configureer iframe
              configureIframe(iframe);
            }
          }, 100);
        }, 500);
      };
      
      chatbotWrapper.appendChild(script);
      
      // Functie om iframe te configureren
      function configureIframe(iframe) {
        // Zorg dat iframe volledige grootte heeft
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.position = 'absolute';
        iframe.style.top = '0';
        iframe.style.left = '0';
        iframe.style.border = 'none';
        iframe.style.backgroundColor = 'transparent';
        
        // Forceer deze stijlen om iframe positioning te garanderen
        applyImportantStyles(iframe);
        
        // Probeer iframe inhoud aan te passen
        tryToAdjustIframeContent(iframe);
        
        // Periodiek controleren en aanpassen
        setInterval(function() {
          applyImportantStyles(iframe);
          tryToAdjustIframeContent(iframe);
        }, 1000);
      }
      
      // Forceer belangrijke stijlen op iframe
      function applyImportantStyles(iframe) {
        iframe.style.setProperty('position', 'absolute', 'important');
        iframe.style.setProperty('top', '0', 'important');
        iframe.style.setProperty('left', '0', 'important');
        iframe.style.setProperty('width', '100%', 'important');
        iframe.style.setProperty('height', '100%', 'important');
        iframe.style.setProperty('background-color', 'transparent', 'important');
      }
      
      // Probeer iframe inhoud aan te passen
      function tryToAdjustIframeContent(iframe) {
        try {
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
          if (!iframeDoc) return;
          
          // Voeg CSS toe aan iframe document
          let style = iframeDoc.getElementById('custom-transparent-style');
          if (!style) {
            style = iframeDoc.createElement('style');
            style.id = 'custom-transparent-style';
            style.textContent = `
              html, body, div, main, section, article, 
              .container, .wrapper, .content, .main, 
              .chat-container, .message-container, .chat-wrapper,
              [class*="container"], [class*="wrapper"], [class*="content"],
              [class*="background"], [class*="bg"] {
                background-color: transparent !important;
                background-image: none !important;
              }
              
              /* Full height fix */
              html, body {
                height: 100% !important;
                min-height: 100% !important;
                overflow: hidden !important;
              }
              
              /* Chat containers moeten volledige hoogte gebruiken */
              .chat-container, .message-container, .chat-wrapper {
                height: 100% !important;
                min-height: 100% !important;
                max-height: 100% !important;
                top: 0 !important;
              }
              
              /* Lichte achtergrond voor berichten zodat ze leesbaar blijven */
              .message, .chat-message, .user-message, .bot-message,
              .message-bubble, [class*="message"], [class*="bubble"] {
                background-color: rgba(255, 255, 255, 0.6) !important;
              }
            `;
            iframeDoc.head.appendChild(style);
          }
        } catch(e) {
          console.log("Cross-origin beperking: kan iframe inhoud niet aanpassen");
        }
      }
      
      // Controleer en garandeer dat bottom-nav zichtbaar blijft
      setInterval(function() {
        const bottomNav = document.getElementById('bottom-nav-container');
        if (bottomNav) {
          bottomNav.style.display = 'flex';
          bottomNav.style.visibility = 'visible';
          bottomNav.style.opacity = '1';
        }
      }, 500);
    });
  </script>
</body>
</html>
