<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kleurboek - Knof's Speelbos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
    /* Reset */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    
    /* Layout */
    .app-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Top bar is standaard aanwezig */
    #top-nav-container {
      flex-shrink: 0;
    }
    
    /* NIEUWE TOOLBOX - Eenvoudig en direct gepositioneerd */
    #drawing-toolbar {
      background-color: transparent;
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0; /* Voorkomt krimpen */
    }
    
    /* Oude container wordt flex om ruimte op te vullen */
    .coloring-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    #canvas-container {
      flex: 1;
      position: relative;
    }
    
    #coloring-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    /* Bottom nav standaard aanwezig */
    #bottom-nav-container {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- SVG filters -->
  <svg class="svg-filters" style="display:none;">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- App container -->
  <div class="app-container">    
    <!-- Top navigatie -->
    <div id="top-nav-container"></div>
    
    <!-- NIEUWE TOOLBAR - Direct onder top nav -->
    <div id="drawing-toolbar">
      <!-- Wordt gevuld door JavaScript -->
    </div>
    
    <!-- Coloring container -->
    <div class="coloring-container">
      <div id="canvas-container">
        <canvas id="coloring-canvas"></canvas>
      </div>
      <!-- Oude UI elementen - nu leeg -->
      <div class="color-tools" style="display:none;"></div>
      <div class="drawing-tools" style="display:none;"></div>
      <div class="coloring-actions" style="display:none;"></div>
    </div>
    
    <!-- Bottom navigatie -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script>
    // Welkomstbericht direct na het laden van common.js
    document.addEventListener('DOMContentLoaded', function() {
      // Wacht even om zeker te zijn dat typeSpeechMessage beschikbaar is
      setTimeout(function() {
        if (typeof typeSpeechMessage === 'function') {
          typeSpeechMessage("Leuk dat je komt kleuren! Wat zullen we maken?");
        }
      }, 500);
    });
  </script>
  <script src="js/coloring.js"></script>
</body>
</html>
