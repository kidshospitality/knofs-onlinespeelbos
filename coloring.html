<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kleurboek - Knof's Speelbos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
    /* Extra stijlen voor betere schaling */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    
    .app-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 100px); /* Ruimte voor top en bottom navigatie */
      padding: 0;
    }
    
    .coloring-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
      position: relative;
    }
    
    #canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    
    #coloring-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .toolbox-container {
    width: 100%;
    background-color: #f8f8f8;
    border-bottom: 1px solid #ddd;
    padding: 5px 0;
    z-index: 10;
  }
  
  /* De controls hoeven niet meer fixed te zijn */
  .controls {
    position: relative;
    bottom: auto;
    z-index: 10;
  }
  </style>
</head>
<body>
  <!-- SVG filters for hand-drawn effect -->
  <svg class="svg-filters">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie -->
  <div id="top-nav-container"></div>

  <!-- Settings modal container -->
  <div id="settings-modal-container"></div>

  <!-- Hoofdcontent - Kleurboek -->
  <div class="app-container">    
  <div class="coloring-container">
    <!-- Nieuwe toolbox container boven het canvas -->
    <div class="toolbox-container"></div>
    
    <div class="color-tools"></div>
    <div class="drawing-tools"></div>
    <div id="canvas-container">
      <canvas id="coloring-canvas"></canvas>
    </div>
    <!-- Deze div bewaarde de oude toolbox onderaan, die we nu leeg laten -->
    <div class="coloring-actions"></div>
  </div>
</div>

  <!-- Container voor bottom navigatie -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script src="js/coloring.js"></script>
</body>
</html>
