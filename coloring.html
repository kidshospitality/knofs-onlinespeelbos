<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kleurboek - Knof's Speelbos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <style>
  /* Reset - iOS Safari Fix */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: none;
  }
  
  /* Layout - iOS Safari Fix */
  .app-container {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    -webkit-transform: translateZ(0);
    -webkit-backface-visibility: hidden;
  }
  
  /* Top nav container fix */
  #top-nav-container {
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  
  /* Toolbar fix */
  #drawing-toolbar {
    background-color: transparent;
    border-bottom: 1px solid #ddd;
    padding: 8px 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-shrink: 0;
    position: relative;
    z-index: 9;
  }
  
  /* Container/Canvas layout fix */
  .coloring-container {
    flex: 1 0 auto;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }
  
  #coloring-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  
  #template-canvas {
    touch-action: none;
  }
  
  /* Bottom navigation fix - meest belangrijk voor je probleem */
  #bottom-nav-container {
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    height: 50px; /* Vaste hoogte voor de navigatiebalk */
    display: flex !important; /* Forceert weergave */
    visibility: visible !important; /* Forceert zichtbaarheid */
    opacity: 1 !important;
    -webkit-transform: translateZ(0); /* Forceert GPU rendering */
  }
</style>
</head>
<body>
  <!-- SVG filters -->
  <svg class="svg-filters" style="display:none;">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- App container -->
  <div class="app-container">    
    <!-- Top navigatie -->
    <div id="top-nav-container"></div>
    
    <!-- NIEUWE TOOLBAR - Direct onder top nav -->
    <div id="drawing-toolbar">
      <!-- Wordt gevuld door JavaScript -->
    </div>
    
    <!-- Coloring container -->
    <div class="coloring-container">
      <div id="canvas-container">
        <canvas id="coloring-canvas"></canvas>
      </div>
      <!-- Oude UI elementen - nu leeg -->
      <div class="color-tools" style="display:none;"></div>
      <div class="drawing-tools" style="display:none;"></div>
      <div class="coloring-actions" style="display:none;"></div>
    </div>
    
    <!-- Bottom navigatie -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script>
    // Welkomstbericht direct na het laden van common.js
    document.addEventListener('DOMContentLoaded', function() {
      // Wacht even om zeker te zijn dat typeSpeechMessage beschikbaar is
      setTimeout(function() {
        if (typeof typeSpeechMessage === 'function') {
          typeSpeechMessage("Leuk dat je komt kleuren! Wat zullen we maken?");
        }
      }, 500);
    });
  </script>
  <script src="js/coloring.js"></script>
</body>
</html>
