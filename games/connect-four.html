<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4 op een rij - Knof's Spelletjes</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="../images/icon-192.png">
  <style>
    /* Stijlen voor het 4 op een rij spel */
    .game-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 10px;
    }

    .game-board {
      background-color: #2A75BB;
      border-radius: 15px;
      padding: 15px;
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      filter: url(#rough-filter);
      border: 3px solid #1E5C96;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #F8F6E9;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      filter: url(#rough-filter);
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
      position: relative;
    }

    .cell.player1-piece::after, 
    .cell.player2-piece::after,
    .cell.knof-piece::after {
      content: '';
      position: absolute;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .cell.player1-piece::after {
      background-image: url('../images/pannenkoek-vrijstaand-rond-stroop.png');
    }

    .cell.player2-piece::after {
      background-image: url('../images/pannenkoek-vrijstaand-rond-suiker.png');
    }

    /* Knof's stuk is suiker pannenkoek */
    .cell.knof-piece::after {
      background-image: url('../images/pannenkoek-vrijstaand-rond-suiker.png');
    }

    .cell.winning {
      animation: blink 0.5s alternate infinite;
    }

    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.5; }
    }

    .column-hover {
      position: absolute;
      top: -50px;
      width: calc(100% / 7 - 10px);
      height: 40px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translateX(5px);
      transition: left 0.2s;
      display: none;
      pointer-events: none;
    }

    .game-info {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      background-color: #FFD6A5;
      border-radius: 10px;
      filter: url(#rough-filter);
      border: 2px solid #FF9A5A;
    }

    .score-board {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 8px;
      padding: 10px;
    }

    .score-card {
      text-align: center;
    }

    .score-card h3 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
    }

    .score-card p {
      margin: 0;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .turn-indicator {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .player-indicator {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .player-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-block;
      position: relative;
    }

    .player-icon.player1-piece::after, 
    .player-icon.player2-piece::after,
    .player-icon.knof-piece::after {
      content: '';
      position: absolute;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .player-icon.player1-piece::after {
      background-image: url('../images/pannenkoek-vrijstaand-rond-stroop.png');
    }

    .player-icon.player2-piece::after {
      background-image: url('../images/pannenkoek-vrijstaand-rond-suiker.png');
    }

    .player-icon.knof-piece::after {
      background-image: url('../images/pannenkoek-vrijstaand-rond-suiker.png');
    }

    .active-player {
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255,165,0,0.7);
    }

    .win-message {
      font-size: 1.6rem;
      color: #4B0082;
      margin-top: 10px;
      font-weight: bold;
    }

    .buttons-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .game-button {
      padding: 12px 20px;
      background-color: #A5BBFF;
      border: 2px solid #7A97FF;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s;
      filter: url(#rough-filter);
    }

    .game-button:hover {
      transform: translateY(-3px);
    }

    .game-button:active {
      transform: scale(0.98);
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* Verwijder titel om meer ruimte te maken */
    .app-container {
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <!-- SVG filters for hand-drawn effect -->
  <svg class="svg-filters">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie -->
  <div id="top-nav-container"></div>

  <!-- Settings modal container -->
  <div id="settings-modal-container"></div>

  <!-- Canvas voor confetti effect -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Hoofdcontent - 4 op een rij spel -->
  <div class="app-container">
    <div class="game-container">
      <!-- Titel verwijderd om meer ruimte te maken -->
      
      <div class="game-board" id="game-board">
        <div class="column-hover" id="column-hover"></div>
        <!-- De kolommen worden dynamisch toegevoegd met JavaScript -->
      </div>
      
      <div class="game-info">
        <div class="score-board">
          <div class="score-card" id="player-score-card">
            <h3 id="player1-name">Speler 1</h3>
            <p id="player-score">0</p>
          </div>
          <div class="score-card" id="opponent-score-card">
            <h3 id="opponent-name">Knof</h3>
            <p id="opponent-score">0</p>
          </div>
        </div>
        <div class="turn-indicator">Nu aan de beurt:</div>
        <div class="player-indicator">
          <div class="player-icon player1-piece active-player" id="player1-indicator"></div>
          <div class="player-icon knof-piece" id="player2-indicator"></div>
        </div>
        <div class="win-message" id="win-message"></div>
        <div class="buttons-container">
          <button class="game-button" id="restart-button">Nieuw spel</button>
          <button class="game-button" id="reset-scores">Reset scores</button>
          <button class="game-button" id="back-button">Terug naar opties</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Container voor bottom navigatie -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="../js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Instellingen voor het spel
      const ROWS = 6;
      const COLS = 7;
      const WINNING_LENGTH = 4;
      
      // Spelstatus
      let gameBoard = [];
      let currentPlayer = 1; // 1 voor speler 1, 2 voor speler 2 (Knof of vriend)
      let gameOver = false;
      let gameMode = '';
      let playerPieces = {
        1: 'player1-piece',
        2: 'player2-piece'
      };
      let winningCells = [];
      let scores = {
        player: 0,
        opponent: 0
      };
      let lastWinner = 0; // Bijhouden wie de laatste winnaar was voor om-en-om starten
      
      // Elementen selecteren
      const gameBoardEl = document.getElementById('game-board');
      const player1NameEl = document.getElementById('player1-name');
      const playerScoreEl = document.getElementById('player-score');
      const opponentNameEl = document.getElementById('opponent-name');
      const opponentScoreEl = document.getElementById('opponent-score');
      const winMessage = document.getElementById('win-message');
      const restartButton = document.getElementById('restart-button');
      const resetScoresButton = document.getElementById('reset-scores');
      const backButton = document.getElementById('back-button');
      const confettiCanvas = document.getElementById('confetti-canvas');
      const context = confettiCanvas.getContext('2d');
      
      // Variabelen voor spelelementen die tijdens het spel worden bijgewerkt
      let player1Indicator;
      let player2Indicator;
      let columnHover;
      
      // Confetti systeem
      let confetti = [];
      let confettiActive = false;
      let confettiAnimationId = null;
      
      function resizeCanvas() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      }
      
      function startConfetti() {
        stopConfetti(); // Stop any existing confetti first
        confettiActive = true;
        confetti = [];
        resizeCanvas();
        
        // Create confetti particles
        for (let i = 0; i < 100; i++) {
          confetti.push({
            x: Math.random() * confettiCanvas.width,
            y: Math.random() * -confettiCanvas.height,
            size: Math.random() * 10 + 5,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            rotation: Math.random() * 360,
            rotationSpeed: Math.random() * 2 - 1,
            speed: Math.random() * 5 + 2
          });
        }
        
        animateConfetti();
      }
      
      function stopConfetti() {
        confettiActive = false;
        if (confettiAnimationId) {
          cancelAnimationFrame(confettiAnimationId);
          confettiAnimationId = null;
        }
        context.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
      
      function animateConfetti() {
        if (!confettiActive) return;
        
        context.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        
        for (let i = 0; i < confetti.length; i++) {
          const p = confetti[i];
          
          context.save();
          context.translate(p.x, p.y);
          context.rotate(p.rotation * Math.PI / 180);
          context.fillStyle = p.color;
          context.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          context.restore();
          
          p.y += p.speed;
          p.rotation += p.rotationSpeed;
          
          if (p.y > confettiCanvas.height) {
            p.y = -10;
            p.x = Math.random() * confettiCanvas.width;
          }
        }
        
        confettiAnimationId = requestAnimationFrame(animateConfetti);
      }
      
      window.addEventListener('resize', resizeCanvas);
      
      // URL parameters uitlezen voor spelmodus
      const urlParams = new URLSearchParams(window.location.search);
      gameMode = urlParams.get('mode') || 'vs-knof';
      
      // Aanpassingen voor de verschillende spelmodi
      if (gameMode === 'vs-knof') {
        // Speler 2 is Knof in deze modus
        playerPieces[2] = 'knof-piece';
        player1NameEl.textContent = 'Jij';
        opponentNameEl.textContent = 'Knof';
        // Welkomstbericht
        setTimeout(() => {
          typeSpeechMessage("4 op een rij is een van mijn favoriete spellen! Jij speelt met de strooppannenkoeken en ik speel met de suikerpannenkoeken. Laten we beginnen!");
        }, 500);
      } else {
        // Speler 2 is een vriend
        playerPieces[2] = 'player2-piece';
        player1NameEl.textContent = 'Speler 1';
        opponentNameEl.textContent = 'Speler 2';
        // Welkomstbericht
        setTimeout(() => {
          typeSpeechMessage("Veel plezier met 4 op een rij! Speler 1 speelt met strooppannenkoeken en Speler 2 met suikerpannenkoeken. Wie wint?");
        }, 500);
      }
      
      // Event listeners
      backButton.addEventListener('click', function() {
        window.location.href = '../games.html';
      });
      
      resetScoresButton.addEventListener('click', function() {
        scores.player = 0;
        scores.opponent = 0;
        lastWinner = 0; // Reset ook de laatste winnaar
        updateScores();
        typeSpeechMessage("Scores zijn gereset. We beginnen weer bij nul!");
      });
      
      // Opnieuw starten
      restartButton.addEventListener('click', function() {
        initializeGame();
        if (gameMode === 'vs-knof') {
          typeSpeechMessage("Laten we nog een keer spelen. Veel plezier!");
        } else {
          typeSpeechMessage("Nieuwe ronde, nieuwe kansen! Wie wint deze keer?");
        }
      });
      
      // Initialiseer het spelbord
      function initializeGame() {
        // Reset game state
        gameBoard = [];
        for (let i = 0; i < ROWS; i++) {
          const row = [];
          for (let j = 0; j < COLS; j++) {
            row.push(0); // 0 betekent lege cel
          }
          gameBoard.push(row);
        }
        
        gameOver = false;
        
        // Bepaal de startende speler op basis van de laatste winnaar
        if (lastWinner === 1) {
          currentPlayer = 2; // Als speler 1 de laatste keer won, begint speler 2
        } else if (lastWinner === 2) {
          currentPlayer = 1; // Als speler 2 de laatste keer won, begint speler 1
        } else {
          currentPlayer = 1; // Standaard begint speler 1
        }
        
        winningCells = [];
        
        // Reset UI
        createGameBoard();
        updateTurnIndicator();
        winMessage.textContent = '';
        
        // Stop confetti als dat actief is
        stopConfetti();
        
        // Laat Knof automatisch zetten als hij mag beginnen
        if (currentPlayer === 2 && gameMode === 'vs-knof' && !gameOver) {
          setTimeout(makeKnofMove, 1000);
        }
      }
      
      // Maak het visuele spelbord
      function createGameBoard() {
        gameBoardEl.innerHTML = '<div class="column-hover" id="column-hover"></div>';
        
        for (let col = 0; col < COLS; col++) {
          const column = document.createElement('div');
          column.className = 'column';
          column.dataset.col = col;
          
          for (let row = 0; row < ROWS; row++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.row = row;
            cell.dataset.col = col;
            column.appendChild(cell);
          }
          
          gameBoardEl.appendChild(column);
        }
        
        // Hover effect voor kolommen
        const columns = document.querySelectorAll('.column');
        columns.forEach(column => {
          column.addEventListener('mouseenter', function() {
            if (!gameOver) {
              // Sta hover alleen toe voor menselijke spelers
              // In vs-knof mode alleen voor speler 1, in vs-friend mode voor beide spelers
              if ((gameMode === 'vs-knof' && currentPlayer === 1) || 
                  (gameMode === 'vs-friend') || 
                  (gameMode !== 'vs-knof' && currentPlayer !== 2)) {
                const colIndex = parseInt(this.dataset.col);
                showColumnHover(colIndex);
              }
            }
          });
          
          column.addEventListener('click', function() {
            if (!gameOver) {
              // Sta klikken alleen toe voor menselijke spelers
              // In vs-knof mode alleen voor speler 1, in vs-friend mode voor beide spelers
              if ((gameMode === 'vs-knof' && currentPlayer === 1) || 
                  (gameMode === 'vs-friend') || 
                  (gameMode !== 'vs-knof' && currentPlayer !== 2)) {
                const colIndex = parseInt(this.dataset.col);
                makeMove(colIndex);
              }
            }
          });
        });
        
        gameBoardEl.addEventListener('mouseleave', function() {
          hideColumnHover();
        });
        
        // Update references to elements that were recreated
        columnHover = document.getElementById('column-hover');
        player1Indicator = document.getElementById('player1-indicator');
        player2Indicator = document.getElementById('player2-indicator');
        
        // Reset player indicators to match game mode
        if (gameMode === 'vs-knof') {
          player2Indicator.className = 'player-icon knof-piece';
        } else {
          player2Indicator.className = 'player-icon player2-piece';
        }
      }
      
      // Toon hover effect voor een kolom
      function showColumnHover(colIndex) {
        if (gameOver || !isValidMove(colIndex) || !columnHover) return;
        
        const columnWidth = gameBoardEl.offsetWidth / COLS;
        columnHover.style.display = 'block';
        columnHover.style.left = `${colIndex * columnWidth}px`;
        
        // Toon de juiste kleur hover effect afhankelijk van de huidige speler
        columnHover.className = 'column-hover ' + playerPieces[currentPlayer];
      }
      
      // Verberg hover effect
      function hideColumnHover() {
        if (columnHover) columnHover.style.display = 'none';
      }
      
      // Update scores
      function updateScores() {
        playerScoreEl.textContent = scores.player;
        opponentScoreEl.textContent = scores.opponent;
      }
      
      // Controleer of een zet geldig is
      function isValidMove(colIndex) {
        return gameBoard[0][colIndex] === 0; // Kijk of de bovenste cel in de kolom leeg is
      }
      
      // Voer een zet uit
      function makeMove(colIndex) {
        if (!isValidMove(colIndex) || gameOver) return;
        
        // Vind de laagste lege cel in de kolom (beginnend vanaf de onderkant)
        let rowIndex = ROWS - 1;
        while (rowIndex >= 0 && gameBoard[rowIndex][colIndex] !== 0) {
          rowIndex--;
        }
        
        if (rowIndex >= 0) {
          // Zet uitvoeren
          gameBoard[rowIndex][colIndex] = currentPlayer;
          
          // Animeer de schijf
          const cell = document.querySelector(`.cell[data-row="${rowIndex}"][data-col="${colIndex}"]`);
          cell.classList.add(playerPieces[currentPlayer]);
          
          // Controleer op winnende zet
          const winResult = checkWin(rowIndex, colIndex);
          if (winResult) {
            gameOver = true;
            winningCells = winResult;
            highlightWinningCells();
            
            // Sla op wie de winnaar is voor het om-en-om beginnen
            lastWinner = currentPlayer;
            
            // Bepaal de juiste tekst afhankelijk van spelmodus
            let winner;
            if (gameMode === 'vs-knof') {
              winner = currentPlayer === 1 ? 'Jij' : 'Knof';
            } else {
              winner = currentPlayer === 1 ? 'Speler 1' : 'Speler 2';
            }
            
            winMessage.textContent = `${winner} wint!`;
            
            // Update scores
            if (currentPlayer === 1) {
              scores.player++;
            } else {
              scores.opponent++;
            }
            updateScores();
            
            // Toon confetti voor beide spelers
            startConfetti();
            
            // Toon passend bericht afhankelijk van de spelmodus
            if (gameMode === 'vs-knof') {
              if (currentPlayer === 1) {
                typeSpeechMessage("Je hebt gewonnen! Gefeliciteerd! Je bent goed in dit spel.");
              } else {
                typeSpeechMessage("Ik heb gewonnen! Dat was een leuk potje. Wil je nog een keer spelen?");
              }
            } else {
              typeSpeechMessage(`${winner} heeft gewonnen! Dat was spannend!`);
            }
          } else if (checkDraw()) {
            gameOver = true;
            winMessage.textContent = "Gelijkspel!";
            typeSpeechMessage("Het is gelijkspel! Jullie zijn aan elkaar gewaagd.");
          } else {
            // Wissel van speler
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateTurnIndicator();
            
            // Als de huidige speler Knof is en het is vs-knof modus, laat Knof een zet doen
            if (currentPlayer === 2 && gameMode === 'vs-knof' && !gameOver) {
              setTimeout(makeKnofMove, 1000);
            }
          }
        }
      }
      
      // Highlight de winnende cellen
      function highlightWinningCells() {
        winningCells.forEach(([row, col]) => {
          const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
          if (cell) cell.classList.add('winning');
        });
      }
      
      // Knof's AI zet
      function makeKnofMove() {
        if (gameOver) return;
        
        // Implementeer Minimax algoritme voor beter AI gedrag
        const bestMove = findBestMove();
        
        // Leuk commentaar van Knof toevoegen afhankelijk van de situatie
        // Kijk of Knof kan winnen met deze zet
        let rowIndex = findLowestEmptyRow(bestMove);
        if (rowIndex >= 0) {
          gameBoard[rowIndex][bestMove] = 2; // Proefzet
          const willWin = checkWin(rowIndex, bestMove);
          gameBoard[rowIndex][bestMove] = 0; // Zet terugdraaien
          
          if (willWin) {
            // Knof weet dat hij gaat winnen
            const taunts = [
              "Ik denk dat ik hier ga winnen!",
              "Kijk eens wat ik hier doe!",
              "Vier op een rij voor mij!",
              "Mijn suikerpannenkoek past hier perfect!"
            ];
            typeSpeechMessage(taunts[Math.floor(Math.random() * taunts.length)]);
          } 
          else {
            // Kijk of Knof een blokkerend zet doet
            let isBlocking = false;
            for (let col = 0; col < COLS; col++) {
              if (col === bestMove) continue; // Skip de huidige zet
              
              let r = findLowestEmptyRow(col);
              if (r >= 0) {
                gameBoard[r][col] = 1; // Doe alsof speler 1 hier zet
                const wouldWin = checkWin(r, col);
                gameBoard[r][col] = 0; // Zet terugdraaien
                
                if (wouldWin && col !== bestMove) {
                  // Knof's bestMove is anders dan deze kolom, maar er was een blokkerende zet nodig
                  isBlocking = true;
                  const blockMessages = [
                    "Dat was bijna gelukt!",
                    "Ik zie wat je probeert te doen!",
                    "Niet zo snel!",
                    "Ik blokkeer je pannenkoek-plan!"
                  ];
                  typeSpeechMessage(blockMessages[Math.floor(Math.random() * blockMessages.length)]);
                  break;
                }
              }
            }
            
            // Als het geen blokkerende zet is, willekeurig commentaar
            if (!isBlocking) {
              const normalMoves = [
                "Hmm, laat me eens nadenken...",
                "Ik kies deze plek!",
                "Mijn beurt!",
                "Mijn suikerpannenkoek gaat hier!",
                "Dit is een goede zet denk ik."
              ];
              
              // 20% kans op een opmerking
              if (Math.random() < 0.2) {
                typeSpeechMessage(normalMoves[Math.floor(Math.random() * normalMoves.length)]);
              }
            }
          }
        }
        
        makeMove(bestMove);
      }
      
      // Implementatie van het minimax algoritme
      function evaluateBoard() {
        // Controleer horizontaal
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col <= COLS - 4; col++) {
            let player1Count = 0;
            let player2Count = 0;
            
            for (let i = 0; i < 4; i++) {
              if (gameBoard[row][col + i] === 1) player1Count++;
              else if (gameBoard[row][col + i] === 2) player2Count++;
            }
            
            if (player1Count === 4) return -100;
            if (player2Count === 4) return 100;
            
            if (player1Count > 0 && player2Count === 0) {
              if (player1Count === 3) return -50;
              if (player1Count === 2) return -10;
              if (player1Count === 1) return -1;
            }
            
            if (player2Count > 0 && player1Count === 0) {
              if (player2Count === 3) return 50;
              if (player2Count === 2) return 10;
              if (player2Count === 1) return 1;
            }
          }
        }
        
        // Controleer verticaal
        for (let row = 0; row <= ROWS - 4; row++) {
          for (let col = 0; col < COLS; col++) {
            let player1Count = 0;
            let player2Count = 0;
            
            for (let i = 0; i < 4; i++) {
              if (gameBoard[row + i][col] === 1) player1Count++;
              else if (gameBoard[row + i][col] === 2) player2Count++;
            }
            
            if (player1Count === 4) return -100;
            if (player2Count === 4) return 100;
            
            if (player1Count > 0 && player2Count === 0) {
              if (player1Count === 3) return -50;
              if (player1Count === 2) return -10;
              if (player1Count === 1) return -1;
            }
            
            if (player2Count > 0 && player1Count === 0) {
              if (player2Count === 3) return 50;
              if (player2Count === 2) return 10;
              if (player2Count === 1) return 1;
            }
          }
        }
        
        // Controleer diagonaal (/)
        for (let row = 3; row < ROWS; row++) {
          for (let col = 0; col <= COLS - 4; col++) {
            let player1Count = 0;
            let player2Count = 0;
            
            for (let i = 0; i < 4; i++) {
              if (gameBoard[row - i][col + i] === 1) player1Count++;
              else if (gameBoard[row - i][col + i] === 2) player2Count++;
            }
            
            if (player1Count === 4) return -100;
            if (player2Count === 4) return 100;
            
            if (player1Count > 0 && player2Count === 0) {
              if (player1Count === 3) return -50;
              if (player1Count === 2) return -10;
              if (player1Count === 1) return -1;
            }
            
            if (player2Count > 0 && player1Count === 0) {
              if (player2Count === 3) return 50;
              if (player2Count === 2) return 10;
              if (player2Count === 1) return 1;
            }
          }
        }
        
        // Controleer diagonaal (\)
        for (let row = 0; row <= ROWS - 4; row++) {
          for (let col = 0; col <= COLS - 4; col++) {
            let player1Count = 0;
            let player2Count = 0;
            
            for (let i = 0; i < 4; i++) {
              if (gameBoard[row + i][col + i] === 1) player1Count++;
              else if (gameBoard[row + i][col + i] === 2) player2Count++;
            }
            
            if (player1Count === 4) return -100;
            if (player2Count === 4) return 100;
            
            if (player1Count > 0 && player2Count === 0) {
              if (player1Count === 3) return -50;
              if (player1Count === 2) return -10;
              if (player1Count === 1) return -1;
            }
            
            if (player2Count > 0 && player1Count === 0) {
              if (player2Count === 3) return 50;
              if (player2Count === 2) return 10;
              if (player2Count === 1) return 1;
            }
          }
        }
        
        return 0; // Neutraal
      }
      
      // Vind de beste zet voor Knof
      function findBestMove() {
        // Controleer eerst of we kunnen winnen
        for (let col = 0; col < COLS; col++) {
          if (isValidMove(col)) {
            let row = findLowestEmptyRow(col);
            if (row >= 0) {
              // Tijdelijk zet doen
              gameBoard[row][col] = 2;
              const win = checkWin(row, col);
              // Zet terugdraaien
              gameBoard[row][col] = 0;
              
              if (win) {
                return col; // Winnende zet
              }
            }
          }
        }
        
        // Controleer of we een winnende zet van de tegenstander moeten blokkeren
        for (let col = 0; col < COLS; col++) {
          if (isValidMove(col)) {
            let row = findLowestEmptyRow(col);
            if (row >= 0) {
              // Tijdelijk zet doen alsof speler 1 hier zou zetten
              gameBoard[row][col] = 1;
              const win = checkWin(row, col);
              // Zet terugdraaien
              gameBoard[row][col] = 0;
              
              if (win) {
                return col; // Blokkeer winnende zet
              }
            }
          }
        }
        
        // Probeer centrum kolom als die beschikbaar is
        const middleCol = 3;
        if (isValidMove(middleCol)) {
          return middleCol;
        }
        
        // Evalueer elke mogelijke zet met een eenvoudig minimax
        let bestScore = -Infinity;
        let bestMoves = [];
        
        for (let col = 0; col < COLS; col++) {
          if (isValidMove(col)) {
            let row = findLowestEmptyRow(col);
            if (row >= 0) {
              // Tijdelijk zet doen
              gameBoard[row][col] = 2;
              let score = evaluateBoard();
              // Zet terugdraaien
              gameBoard[row][col] = 0;
              
              if (score > bestScore) {
                bestScore = score;
                bestMoves = [col];
              } else if (score === bestScore) {
                bestMoves.push(col);
              }
            }
          }
        }
        
        // Als er geen goede zet is gevonden, kies een willekeurige geldige kolom
        if (bestMoves.length === 0) {
          for (let col = 0; col < COLS; col++) {
            if (isValidMove(col)) {
              bestMoves.push(col);
            }
          }
        }
        
        // Kies een willekeurige zet uit de beste zetten
        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
      }
      
      // Vind de laagste lege rij in een kolom
      function findLowestEmptyRow(col) {
        for (let row = ROWS - 1; row >= 0; row--) {
          if (gameBoard[row][col] === 0) {
            return row;
          }
        }
        return -1;
      }
      
      // Update de beurtindicator
      function updateTurnIndicator() {
        if (!player1Indicator || !player2Indicator) return;
        
        if (currentPlayer === 1) {
          player1Indicator.classList.add('active-player');
          player2Indicator.classList.remove('active-player');
        } else {
          player1Indicator.classList.remove('active-player');
          player2Indicator.classList.add('active-player');
        }
      }
      
      // Controleer op winnende zet
      function checkWin(row, col) {
        const player = gameBoard[row][col];
        if (player === 0) return null;
        
        const directions = [
          [0, 1],  // horizontaal
          [1, 0],  // verticaal
          [1, 1],  // diagonaal rechtsonder
          [1, -1]  // diagonaal linksonder
        ];
        
        for (const [dRow, dCol] of directions) {
          const cells = [];
          cells.push([row, col]);
          
          // Controleer in één richting
          let r = row + dRow;
          let c = col + dCol;
          let count = 1;
          
          while (r >= 0 && r < ROWS && c >= 0 && c < COLS && gameBoard[r][c] === player) {
            cells.push([r, c]);
            count++;
            r += dRow;
            c += dCol;
          }
          
          // Controleer in tegenovergestelde richting
          r = row - dRow;
          c = col - dCol;
          
          while (r >= 0 && r < ROWS && c >= 0 && c < COLS && gameBoard[r][c] === player) {
            cells.push([r, c]);
            count++;
            r -= dRow;
            c -= dCol;
          }
          
          if (count >= 4) {
            return cells;
          }
        }
        
        return null;
      }
      
      // Controleer op gelijkspel
      function checkDraw() {
        for (let col = 0; col < COLS; col++) {
          if (gameBoard[0][col] === 0) {
            return false; // Er is nog een lege plaats
          }
        }
        return true; // Bord is vol
      }
      
      // Start het spel
      initializeGame();
      updateScores();
      resizeCanvas();
    });
