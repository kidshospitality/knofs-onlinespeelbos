<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ingrediënten Zoeken - Knof's Spelletjes</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="../images/icon-192.png">
  <style>
    /* Stijlen voor het Ingrediënten Zoeken spel */
    .game-container {
      max-width: 100%;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .game-board {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 20px;
      order: 1;
    }

    .game-info {
      order: 2;
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      background-color: #FFD6A5;
      border-radius: 10px;
      filter: url(#rough-filter);
      border: 2px solid #FF9A5A;
    }

    .target-ingredient-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 15px;
      background-color: #FFD6A5;
      border-radius: 15px;
      filter: url(#rough-filter);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      border: 3px solid #FF9A5A;
      margin-bottom: 10px;
      z-index: 10;
    }

    .target-label {
      font-size: 1.2rem;
      font-weight: bold;
      color: #7A4127;
      margin-right: 15px;
    }

    .target-ingredient {
      font-size: 3rem;
      background-color: #FFEF9E;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      filter: url(#rough-filter);
      border: 2px solid #FFDDA1;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      }
      to {
        transform: scale(1.1);
        box-shadow: 0 4px 15px rgba(255, 154, 90, 0.7);
      }
    }

    .pancake-container {
      width: 100%;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .round-counter {
      position: absolute;
      right: 20px;
      top: 20px;
      background-color: #FF9A5A;
      color: white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      filter: url(#rough-filter);
      border: 2px solid #F27D30;
      z-index: 2;
    }

    .pancake {
      width: 85vmin;
      height: 85vmin;
      max-width: 500px;
      max-height: 500px;
      background-color: #FFEEB3;
      border-radius: 50%;
      position: relative;
      padding: 20px;
      filter: url(#rough-filter);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      border: 4px solid #FFDDA1;
      transform-origin: center;
      overflow: hidden;
    }

    .pancake::before {
      content: '';
      position: absolute;
      width: 92%;
      height: 92%;
      top: 4%;
      left: 4%;
      background-color: #FFEF9E;
      border-radius: 50%;
      z-index: 0;
      filter: url(#squiggly-filter);
    }

    .pancake.correct {
      animation: correct-pulse 0.5s;
    }

    @keyframes correct-pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 8px 30px rgba(0, 255, 0, 0.6);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      }
    }

    .pancake.wrong {
      animation: wrong-shake 0.5s;
    }

    @keyframes wrong-shake {
      0%, 100% {
        transform: translateX(0);
      }
      20%, 60% {
        transform: translateX(-10px);
      }
      40%, 80% {
        transform: translateX(10px);
      }
    }

    .ingredient {
      position: absolute;
      font-size: 2.5rem;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center;
      transition: transform 0.2s;
      cursor: pointer;
      width: 50px;
      height: 50px;
    }

    .ingredient:hover {
      transform: scale(1.2);
      z-index: 5;
    }

    .ingredient:active {
      transform: scale(0.9);
    }

    .ingredient.highlighted {
      animation: highlight-pop 0.5s forwards;
      z-index: 10;
    }

    @keyframes highlight-pop {
      0% {
        transform: scale(1);
        background-color: transparent;
      }
      50% {
        transform: scale(1.3);
        background-color: rgba(255, 215, 0, 0.4);
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        border-radius: 50%;
      }
      100% {
        transform: scale(1.2);
        background-color: rgba(255, 215, 0, 0.3);
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        border-radius: 50%;
      }
    }

    .timer-container {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 60px;
      height: 60px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #FF6B6B;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      filter: url(#rough-filter);
      z-index: 2;
    }

    .timer-circle {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid #FF6B6B;
      clip: rect(0px, 60px, 60px, 30px);
      transform: rotate(-90deg);
    }

    .timer-animation {
      animation: countdown-animation var(--timer-duration) linear 1 forwards;
    }

    @keyframes countdown-animation {
      from {
        transform: rotate(-90deg);
      }
      to {
        transform: rotate(270deg);
      }
    }

    .score-board {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 8px;
      padding: 10px;
    }

    .player-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .score-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
    }

    .score-card h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .score-card p {
      margin: 5px 0 0 0;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .player-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-block;
      position: relative;
      background-color: #F8F6E9;
    }

    .active-player {
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255,165,0,0.7);
    }

    .win-message {
      font-size: 1.6rem;
      color: #4B0082;
      margin-top: 10px;
      font-weight: bold;
      min-height: 2.5rem;
    }

    .buttons-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .game-button {
      padding: 10px 15px;
      background-color: #A5BBFF;
      border: 2px solid #7A97FF;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
      filter: url(#rough-filter);
      min-width: 80px;
    }

    .game-button:hover {
      transform: translateY(-3px);
    }

    .game-button:active {
      transform: scale(0.98);
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* Stijlen voor level selectie */
    .level-select {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .level-button {
      padding: 8px 15px;
      background-color: #FFDDA1;
      border: 2px solid #FFCC80;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      filter: url(#rough-filter);
    }

    .level-button.active {
      background-color: #FF9A5A;
      color: white;
      transform: scale(1.1);
    }

    /* Animatie voor behaalde punten */
    .point-animation {
      position: absolute;
      color: #4CAF50;
      font-weight: bold;
      font-size: 1.5rem;
      animation: float-up 1s forwards;
      z-index: 100;
      pointer-events: none;
    }

    @keyframes float-up {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-50px);
      }
    }

    .tutorial-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .tutorial-content {
      background-color: #F8F6E9;
      border-radius: 15px;
      padding: 20px;
      max-width: 80%;
      text-align: center;
      position: relative;
      filter: url(#rough-filter);
      border: 4px solid #FFDDA1;
    }

    .tutorial-content h2 {
      color: #FF9A5A;
      margin-top: 0;
    }

    .tutorial-content p {
      margin-bottom: 20px;
    }

    .example-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
    }

    .example-target {
      font-size: 2rem;
      background-color: #FFEF9E;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .example-pancake {
      width: 150px;
      height: 150px;
      background-color: #FFEEB3;
      border-radius: 50%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 10px;
    }

    .example-ingredient {
      font-size: 1.5rem;
      margin: 5px;
    }

    .highlight-arrow {
      position: absolute;
      font-size: 2rem;
      color: #FF6B6B;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateX(-50%) translateY(0);
      }
      to {
        transform: translateX(-50%) translateY(-10px);
      }
    }

    /* Countdown stijlen */
    .countdown-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1500;
    }

    .countdown-number {
      font-size: 8rem;
      color: white;
      font-weight: bold;
      animation: countdown-pop 0.9s ease-out;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    .start-text {
      font-size: 5rem;
      color: #FF9A5A;
      font-weight: bold;
      animation: start-pop 0.5s ease-out;
      text-shadow: 0 0 20px rgba(255, 154, 90, 0.8);
    }

    @keyframes countdown-pop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes start-pop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      80% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Block overlay tijdens transities */
    .block-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1200;
      display: none;
      cursor: not-allowed;
    }

    /* Aanpassingen voor mobiele schermen */
    @media (max-width: 768px) {
      .pancake {
        width: 80vmin;
        height: 80vmin;
      }
      
      .ingredient {
        font-size: 2rem;
        width: 40px;
        height: 40px;
      }
      
      .target-ingredient {
        font-size: 2.5rem;
        width: 60px;
        height: 60px;
      }

      .target-label {
        font-size: 1rem;
      }
      
      .countdown-number {
        font-size: 6rem;
      }
      
      .start-text {
        font-size: 4rem;
      }
    }

    @media (max-width: 480px) {
      .pancake {
        width: 75vmin;
        height: 75vmin;
      }
      
      .ingredient {
        font-size: 1.8rem;
        width: 35px;
        height: 35px;
      }
      
      .target-ingredient {
        font-size: 2.2rem;
        width: 50px;
        height: 50px;
      }

      .target-label {
        font-size: 0.9rem;
      }
      
      .timer-container, .round-counter {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }

      .timer-circle {
        width: 36px;
        height: 36px;
      }
      
      .countdown-number {
        font-size: 5rem;
      }
      
      .start-text {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <!-- SVG filters voor handgetekend effect -->
  <svg class="svg-filters">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie -->
  <div id="top-nav-container"></div>

  <!-- Settings modal container -->
  <div id="settings-modal-container"></div>

  <!-- Canvas voor confetti effect -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Countdown overlay -->
  <div class="countdown-overlay" id="countdown-overlay" style="display: none;">
    <div class="countdown-number" id="countdown-number">3</div>
  </div>

  <!-- Block overlay tijdens transities -->
  <div class="block-overlay" id="block-overlay"></div>

  <!-- Hoofdcontent - Ingrediënten Zoeken spel -->
  <div class="app-container">
    <div class="game-container">
      <!-- Spelbord bovenaan -->
      <div class="game-board" id="game-board">
        <div class="target-ingredient-container">
          <div class="target-label">Zoek dit ingrediënt:</div>
          <div class="target-ingredient" id="target-ingredient">🍓</div>
        </div>

        <div class="pancake-container">
          <div class="pancake" id="pancake">
            <!-- Ingrediënten worden hier dynamisch toegevoegd -->
          </div>
          <div class="round-counter" id="round-counter">1/10</div>
          <div class="timer-container" id="timer-container">
            <div class="timer-circle" id="timer-circle"></div>
            <span id="timer-count">30</span>
          </div>
        </div>
      </div>

      <!-- Game informatie onder het spelbord -->
      <div class="game-info">
        <div class="score-board">
          <div class="score-card" id="player-score-card">
            <div class="player-heading">
              <h3 id="player1-name">Jij</h3>
              <div class="player-icon" id="player1-indicator"></div>
            </div>
            <p id="player-score">0</p>
          </div>
          <div class="score-card" id="opponent-score-card">
            <div class="player-heading">
              <h3 id="opponent-name">Knof</h3>
              <div class="player-icon" id="player2-indicator"></div>
            </div>
            <p id="opponent-score">0</p>
          </div>
        </div>

        <div class="level-select">
          <div class="level-button active" data-level="easy">Makkelijk</div>
          <div class="level-button" data-level="medium">Normaal</div>
          <div class="level-button" data-level="hard">Moeilijk</div>
        </div>

        <div class="win-message" id="win-message"></div>
        <div class="buttons-container">
          <button class="game-button" id="restart-button">Nieuw spel</button>
          <button class="game-button" id="reset-scores">Reset</button>
          <button class="game-button" id="back-button">Terug</button>
          <button class="game-button" id="help-button">Help</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Container voor bottom navigatie -->
  <div id="bottom-nav-container"></div>

  <!-- Tutorial overlay -->
  <div class="tutorial-overlay" id="tutorial-overlay" style="display: none;">
    <div class="tutorial-content">
      <h2>Hoe speel je Ingrediënten Zoeken?</h2>
      <p>Zoek het aangegeven ingrediënt zo snel mogelijk op de pannenkoek!</p>

      <div class="example-container">
        <div class="example-target">🍓</div>
        <div class="highlight-arrow">↓</div>
        <div class="example-pancake">
          <div class="example-ingredient">🍌</div>
          <div class="example-ingredient">🍫</div>
          <div class="example-ingredient">🍓</div>
          <div class="example-ingredient">🧀</div>
        </div>
      </div>

      <p>Klik op het juiste ingrediënt om een punt te scoren. Wie het eerst 10 punten heeft, wint!</p>
      <button class="game-button" id="tutorial-close">Ik snap het!</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // ===== GAME CONSTANTS =====
      const ROUNDS_PER_GAME = 10;
      const MAX_SCORE = 10;
      const INGREDIENTS_PER_ROUND = {
        easy: 7,
        medium: 10,
        hard: 13
      };
      
      // Eetbare ingrediënten (emoji's)
      const INGREDIENTS = [
        '🍓', '🍌', '🍫', '🍯', '🧀', '🍎', '🍊', '🥞', 
        '🍒', '🍋', '🥥', '🍦', '🍪', '🍰', '🍧', '🍩', 
        '🥜', '🍇', '🍬', '🍭', '🍈', '🍑', '🍍', 
        '🍉', '🍐', '🧁', '🍨', '🥐', '🧈',
        '🍏', '🍕', '🍔', '🍟', '🌭', '🍿'
      ];
      
      // ===== DOM ELEMENTS =====
      const pancakeEl = document.getElementById('pancake');
      const targetIngredientEl = document.getElementById('target-ingredient');
      const playerScoreEl = document.getElementById('player-score');
      const opponentScoreEl = document.getElementById('opponent-score');
      const winMessage = document.getElementById('win-message');
      const restartButton = document.getElementById('restart-button');
      const resetScoresButton = document.getElementById('reset-scores');
      const backButton = document.getElementById('back-button');
      const helpButton = document.getElementById('help-button');
      const tutorialOverlay = document.getElementById('tutorial-overlay');
      const tutorialClose = document.getElementById('tutorial-close');
      const confettiCanvas = document.getElementById('confetti-canvas');
      const roundCounter = document.getElementById('round-counter');
      const timerContainer = document.getElementById('timer-container');
      const timerCircle = document.getElementById('timer-circle');
      const timerCount = document.getElementById('timer-count');
      const levelButtons = document.querySelectorAll('.level-button');
      const countdownOverlay = document.getElementById('countdown-overlay');
      const countdownNumber = document.getElementById('countdown-number');
      const blockOverlay = document.getElementById('block-overlay');
      
      // ===== GAME STATE =====
      let gameMode = '';
      let scores = {
        player: 0,
        opponent: 0
      };
      let gameOver = false;
      let currentRound = 1;
      let targetIngredient = null;
      let pancakeIngredients = [];
      let timerInterval = null;
      let remainingTime = 30;
      let gamePaused = false;
      let difficulty = 'easy'; // default moeilijkheidsgraad
      let difficultySettings = {
        easy: { time: 30, knofDelay: 5000 },
        medium: { time: 20, knofDelay: 3000 },
        hard: { time: 10, knofDelay: 1500 }
      };
      let knofMoveTimeout = null;
      let confetti = [];
      let confettiActive = false;
      let confettiAnimationId = null;
      let countdownActive = false;
      let interactionBlocked = false;
      
      // ===== UTILITY FUNCTIONS =====
      
      // Block or unblock user interaction
      function toggleInteractionBlocking(block) {
        interactionBlocked = block;
        blockOverlay.style.display = block ? 'block' : 'none';
      }
      
      // Resize canvas for confetti
      function resizeCanvas() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      }
      
      // Shuffle array using Fisher-Yates algorithm
      function shuffleArray(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
      }
      
      // Generate random number between min and max (inclusive)
      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }
      
      // ===== CONFETTI EFFECT =====
      
      function startConfetti() {
        stopConfetti(); // Stop any existing confetti first
        confettiActive = true;
        confetti = [];
        resizeCanvas();
        
        // Create confetti particles
        for (let i = 0; i < 100; i++) {
          confetti.push({
            x: Math.random() * confettiCanvas.width,
            y: Math.random() * -confettiCanvas.height,
            size: Math.random() * 10 + 5,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            rotation: Math.random() * 360,
            rotationSpeed: Math.random() * 2 - 1,
            speed: Math.random() * 5 + 2
          });
        }
        
        animateConfetti();
      }
      
      function stopConfetti() {
        confettiActive = false;
        if (confettiAnimationId) {
          cancelAnimationFrame(confettiAnimationId);
          confettiAnimationId = null;
        }
        const context = confettiCanvas.getContext('2d');
        context.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
      
      function animateConfetti() {
        if (!confettiActive) return;
        
        const context = confettiCanvas.getContext('2d');
        context.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        
        for (let i = 0; i < confetti.length; i++) {
          const p = confetti[i];
          
          context.save();
          context.translate(p.x, p.y);
          context.rotate(p.rotation * Math.PI / 180);
          context.fillStyle = p.color;
          context.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          context.restore();
          
          p.y += p.speed;
          p.rotation += p.rotationSpeed;
          
          if (p.y > confettiCanvas.height) {
            p.y = -10;
            p.x = Math.random() * confettiCanvas.width;
          }
        }
        
        confettiAnimationId = requestAnimationFrame(animateConfetti);
      }
      
      // ===== GAME INITIALIZATION =====
      
      // Get URL parameters for game mode
      function initGameMode() {
        const urlParams = new URLSearchParams(window.location.search);
        gameMode = urlParams.get('mode') || 'vs-knof';
        
        // Adjust UI for different game modes
        if (gameMode === 'vs-knof') {
          document.getElementById('player1-name').textContent = 'Jij';
          document.getElementById('opponent-name').textContent = 'Knof';
          // Welkom bericht voor Knof-modus
          setTimeout(() => {
            typeSpeechMessage("Welkom bij Ingrediënten Zoeken! Klik zo snel mogelijk op het juiste ingrediënt op de pannenkoek. Veel plezier!");
          }, 500);
        } else {
          document.getElementById('player1-name').textContent = 'Speler 1';
          document.getElementById('opponent-name').textContent = 'Speler 2';
          // Welkom bericht voor twee-speler-modus
          setTimeout(() => {
            typeSpeechMessage("Ingrediënten Zoeken met z'n tweeën! Gebruik dezelfde knop om het juiste ingrediënt aan te wijzen. Wie het eerst ziet, klikt en wint!");
          }, 500);
        }
      }
      
      // ===== COUNTDOWN FUNCTIONALITY =====
      
      // Display and animate countdown
      function showCountdown(callback) {
        countdownActive = true;
        toggleInteractionBlocking(true);
        countdownOverlay.style.display = 'flex';
        countdownNumber.textContent = '3';
        countdownNumber.className = 'countdown-number';
        
        // Start de countdown
        let count = 3;
        
        const countdownInterval = setInterval(() => {
          count--;
          
          if (count > 0) {
            countdownNumber.textContent = count;
            // Trigger animation restart
            countdownNumber.classList.remove('countdown-number');
            void countdownNumber.offsetWidth; // Force reflow
            countdownNumber.classList.add('countdown-number');
          } else if (count === 0) {
            countdownNumber.textContent = 'START!';
            countdownNumber.className = 'start-text';
          } else {
            clearInterval(countdownInterval);
            countdownOverlay.style.display = 'none';
            countdownActive = false;
            toggleInteractionBlocking(false);
            if (callback) callback();
          }
        }, 1000);
      }
      
      // ===== GAME LOGIC =====
      
      // Generate ingredients for the current round
      function generateIngredients() {
        const count = INGREDIENTS_PER_ROUND[difficulty];
        
        // Shuffle ingredients and select a subset
        const shuffledIngredients = shuffleArray(INGREDIENTS);
        const selectedIngredients = shuffledIngredients.slice(0, count);
        
        // Choose one ingredient as the target
        const targetIndex = Math.floor(Math.random() * selectedIngredients.length);
        targetIngredient = selectedIngredients[targetIndex];
        
        // Return the selected ingredients for the pancake
        return selectedIngredients;
      }
      
      // Update the round counter display
      function updateRoundCounter() {
        roundCounter.textContent = `${currentRound}/${ROUNDS_PER_GAME}`;
      }

      // Bepaal een willekeurige positie op de pannenkoek die binnen de cirkel ligt
      function getRandomPositionInCircle() {
        const pancakeWidth = pancakeEl.offsetWidth;
        const pancakeHeight = pancakeEl.offsetHeight;
        const centerX = pancakeWidth / 2;
        const centerY = pancakeHeight / 2;
        const maxRadius = (Math.min(pancakeWidth, pancakeHeight) / 2) - 30; // 30px marge
        
        let x, y, distance;
        
        // Loop totdat we een positie vinden die binnen de cirkel valt
        do {
          // Genereer willekeurige positie binnen een vierkant
          const angle = Math.random() * 2 * Math.PI;
          const radius = Math.random() * maxRadius;
          x = centerX + radius * Math.cos(angle);
          y = centerY + radius * Math.sin(angle);
          
          // Bereken afstand tot het centrum (Pythagoras)
          distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
          
        } while (distance > maxRadius);
        
        return { x, y };
      }
      
      // Check of twee ingrediënten elkaar overlappen
      function checkOverlap(pos1, pos2, minDistance) {
        const dx = pos1.x - pos2.x;
        const dy = pos1.y - pos2.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        return distance < minDistance;
      }
      
      // Display ingredients on the pancake
      function displayPancake() {
        pancakeEl.innerHTML = ''; // Clear pancake
        
        const positions = [];
        const ingredientSize = 50; // Grootte van ingredient element
        const minDistance = ingredientSize * 1.2; // Minimale afstand tussen ingrediënten
        
        // Plaats elk ingredient op een willekeurige niet-overlappende positie
        pancakeIngredients.forEach((ingredient, index) => {
          let position;
          let attempts = 0;
          const maxAttempts = 50; // Maximum aantal pogingen om een niet-overlappende positie te vinden
          
          // Zoek een positie die niet overlapt met bestaande ingrediënten
          do {
            position = getRandomPositionInCircle();
            attempts++;
            
            // Als we te veel pogingen hebben gedaan, accepteer dan de overlap
            if (attempts > maxAttempts) break;
            
          } while (positions.some(pos => checkOverlap(pos, position, minDistance)));
          
          positions.push(position);
          
          // Maak het ingredient element
          const ingredientEl = document.createElement('div');
          ingredientEl.className = 'ingredient';
          ingredientEl.textContent = ingredient;
          ingredientEl.dataset.ingredient = ingredient;
          
          // Positioneer het ingredient
          ingredientEl.style.left = `${position.x - (ingredientSize / 2)}px`;
          ingredientEl.style.top = `${position.y - (ingredientSize / 2)}px`;
          
          // Random rotation voor meer speelsheid
          const rotation = randomInt(-15, 15);
          ingredientEl.style.transform = `rotate(${rotation}deg)`;
          
          // Add click handler for the ingredient
          ingredientEl.addEventListener('click', function(e) {
            if (gameOver || countdownActive || interactionBlocked || gamePaused) return;
            
            const clickedIngredient = this.dataset.ingredient;
            handleIngredientClick(clickedIngredient, 'player');
            
            // Voorkom bubblen van events
            e.stopPropagation();
          });
          
          pancakeEl.appendChild(ingredientEl);
        });
      }
      
      // Display the target ingredient
      function displayTargetIngredient() {
        targetIngredientEl.textContent = targetIngredient;
      }
      
      // Show +1 point animation
      function showPointAnimation(element, text) {
        const pointEl = document.createElement('div');
        pointEl.className = 'point-animation';
        pointEl.textContent = text;
        
        // Position near the element
        const rect = element.getBoundingClientRect();
        const boardRect = document.getElementById('game-board').getBoundingClientRect();
        
        pointEl.style.left = (rect.left + rect.width / 2 - boardRect.left) + 'px';
        pointEl.style.top = (rect.top - boardRect.top) + 'px';
        
        document.getElementById('game-board').appendChild(pointEl);
        
        // Remove after animation completes
        setTimeout(() => {
          pointEl.remove();
        }, 1000);
      }
      
      // Handle ingredient click
      function handleIngredientClick(ingredient, clickedBy) {
        // Voorkom dubbele klikken tijdens de animatie
        if (interactionBlocked) return;
        
        toggleInteractionBlocking(true);
        
        // Cancel Knof's pending move if player clicks first
        if (knofMoveTimeout) {
          clearTimeout(knofMoveTimeout);
          knofMoveTimeout = null;
        }
        
        if (ingredient === targetIngredient) {
          // Correct match!
          if (clickedBy === 'player') {
            scores.player++;
            showPointAnimation(pancakeEl, '+1');
            pancakeEl.classList.add('correct');
            
            // Highlight the correct ingredient
            const ingredientEl = pancakeEl.querySelector(`.ingredient[data-ingredient="${ingredient}"]`);
            if (ingredientEl) {
              ingredientEl.classList.add('highlighted');
            }
            
            // Update scores immediately
            updateScores();
            
            // Give feedback with chance of 50%
            if (gameMode === 'vs-knof' && Math.random() < 0.5) {
              const praises = [
                "Goed gedaan!", 
                "Slim!", 
                "Je bent snel!", 
                "Super!", 
                "Je hebt goede ogen!"
              ];
              typeSpeechMessage(praises[Math.floor(Math.random() * praises.length)]);
            }
            
            // Check for win
            if (scores.player >= MAX_SCORE) {
              setTimeout(() => {
                endGame();
              }, 1000);
              return;
            }
            
            // Move to next round after animation
            setTimeout(() => {
              pancakeEl.classList.remove('correct');
              nextRound();
              toggleInteractionBlocking(false);
            }, 1000);
            
          } else if (clickedBy === 'opponent') {
            scores.opponent++;
            showPointAnimation(pancakeEl, '+1');
            pancakeEl.classList.add('correct');
            
            // Highlight the correct ingredient
            const ingredientEl = pancakeEl.querySelector(`.ingredient[data-ingredient="${ingredient}"]`);
            if (ingredientEl) {
              ingredientEl.classList.add('highlighted');
            }
            
            // Update scores immediately
            updateScores();
            
            // Give feedback with chance of 50%
            if (gameMode === 'vs-knof' && Math.random() < 0.5) {
              const knofComments = [
                "Ha! Die zag ik meteen!", 
                "Ik was sneller!", 
                "Dat was makkelijk!", 
                "Mijn beurt om te scoren!"
              ];
              typeSpeechMessage(knofComments[Math.floor(Math.random() * knofComments.length)]);
            }
            
            // Check for win
            if (scores.opponent >= MAX_SCORE) {
              setTimeout(() => {
                endGame();
              }, 1000);
              return;
            }
            
            // Move to next round after animation
            setTimeout(() => {
              pancakeEl.classList.remove('correct');
              nextRound();
              toggleInteractionBlocking(false);
            }, 1000);
          }
          
        } else {
          // Incorrect match
          if (clickedBy === 'player') {
            pancakeEl.classList.add('wrong');
            
            // Give feedback with chance of 30%
            if (gameMode === 'vs-knof' && Math.random() < 0.3) {
              const incorrectComments = [
                "Oeps, dat is niet het juiste ingrediënt!", 
                "Probeer nog eens!", 
                "Kijk goed naar welk ingrediënt je moet zoeken!"
              ];
              typeSpeechMessage(incorrectComments[Math.floor(Math.random() * incorrectComments.length)]);
            }
            
            setTimeout(() => {
              pancakeEl.classList.remove('wrong');
              toggleInteractionBlocking(false);
            }, 500);
          }
        }
      }
      
      // Setup next round
      function nextRound() {
        // Clear Knof timeout if it exists
        if (knofMoveTimeout) {
          clearTimeout(knofMoveTimeout);
          knofMoveTimeout = null;
        }
        
        // If we've reached the end of the rounds, check scores
        if (currentRound >= ROUNDS_PER_GAME) {
          if (scores.player !== scores.opponent) {
            endGame();
            return;
          } else {
            // If tied, go to tie-break round
            typeSpeechMessage("Gelijkspel! We spelen nog een extra ronde.");
          }
        } else {
          currentRound++;
        }
        
        updateRoundCounter();
        
        // Generate new ingredients
        pancakeIngredients = generateIngredients();
        
        // Display the new pancake and target
        displayPancake();
        displayTargetIngredient();
        
        // Reset and start timer
        resetTimer();
        
        // If playing against Knof, schedule his move
        if (gameMode === 'vs-knof' && !gameOver) {
          scheduleKnofMove();
        }
      }
      
      // Schedule Knof's move based on difficulty
      function scheduleKnofMove() {
        if (countdownActive || gameOver || interactionBlocked || gamePaused) return;
        
        const knofDelay = difficultySettings[difficulty].knofDelay;
        
        // Random factor for more natural timing (±20%)
        const randomFactor = 1 + (Math.random() * 0.4 - 0.2);
        const finalDelay = Math.floor(knofDelay * randomFactor);
        
        knofMoveTimeout = setTimeout(() => {
          if (!gameOver && !countdownActive && !interactionBlocked && !gamePaused) {
            // Knof finds the target ingredient
            handleIngredientClick(targetIngredient, 'opponent');
          }
        }, finalDelay);
      }
      
      // ===== TIMER FUNCTIONALITY =====
      
      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        
        remainingTime = difficultySettings[difficulty].time;
        timerCount.textContent = remainingTime;
        
        // Set CSS variable for timer duration
        timerCircle.style.setProperty('--timer-duration', `${remainingTime}s`);
        
        // Reset and restart animation
        timerCircle.classList.remove('timer-animation');
        void timerCircle.offsetWidth; // Force reflow
        timerCircle.classList.add('timer-animation');
        
        timerInterval = setInterval(() => {
          if (gamePaused) return;
          
          remainingTime--;
          timerCount.textContent = remainingTime;
          
          if (remainingTime <= 0) {
            clearInterval(timerInterval);
            timerTimeUp();
          }
        }, 1000);
      }
      
      function pauseTimer() {
        gamePaused = true;
        
        // Pause animation
        const computedStyle = window.getComputedStyle(timerCircle);
        const animationProgress = computedStyle.getPropertyValue('transform');
        timerCircle.classList.remove('timer-animation');
        timerCircle.style.transform = animationProgress;
      }
      
      function resumeTimer() {
        gamePaused = false;
        
        // Resume animation
        timerCircle.style.setProperty('--timer-duration', `${remainingTime}s`);
        timerCircle.classList.add('timer-animation');
      }
      
      function resetTimer() {
        clearInterval(timerInterval);
        remainingTime = difficultySettings[difficulty].time;
        timerCount.textContent = remainingTime;
        
        startTimer();
      }
      
      function timerTimeUp() {
        if (countdownActive || interactionBlocked || gameOver) return;
        
        // Block interaction during animation
        toggleInteractionBlocking(true);
        
        // When time runs out, Knof gets a point if playing against Knof
        if (gameMode === 'vs-knof' && !gameOver) {
          scores.opponent++;
          updateScores();
          
          // Highlight the target ingredient that was missed
          highlightTargetIngredient();
          
          const timeUpComments = [
            "Tijd is om! Ik win deze ronde.",
            "Te langzaam! Ik krijg een punt.",
            "De tijd is voorbij! Kijk, hier was het ingrediënt."
          ];
          typeSpeechMessage(timeUpComments[Math.floor(Math.random() * timeUpComments.length)]);
          
          // Check for win
          if (scores.opponent >= MAX_SCORE) {
            setTimeout(() => {
              endGame();
            }, 2000);
            return;
          }
          
          // After a short delay to show the highlighted ingredient, move to next round
          setTimeout(() => {
            nextRound();
            toggleInteractionBlocking(false);
          }, 2000);
        } else {
          // In 2-player mode, nobody gets a point, just go to next round
          highlightTargetIngredient();
          typeSpeechMessage("Tijd is op! Niemand krijgt een punt deze ronde.");
          
          setTimeout(() => {
            nextRound();
            toggleInteractionBlocking(false);
          }, 2000);
        }
      }
      
      // Highlight the target ingredient when time runs out
      function highlightTargetIngredient() {
        // Find and highlight the ingredient on the pancake
        const ingredientEl = pancakeEl.querySelector(`.ingredient[data-ingredient="${targetIngredient}"]`);
        
        if (ingredientEl) {
          ingredientEl.classList.add('highlighted');
        }
      }
      
      // Update scores
      function updateScores() {
        playerScoreEl.textContent = scores.player;
        opponentScoreEl.textContent = scores.opponent;
      }
      
      // ===== GAME FLOW CONTROL =====
      
      // End the game
      function endGame() {
        gameOver = true;
        clearInterval(timerInterval);
        
        if (knofMoveTimeout) {
          clearTimeout(knofMoveTimeout);
          knofMoveTimeout = null;
        }
        
        if (scores.player > scores.opponent) {
          winMessage.textContent = gameMode === 'vs-knof' ? 'Jij wint!' : 'Speler 1 wint!';
          startConfetti();
          
          if (gameMode === 'vs-knof') {
            typeSpeechMessage("Gefeliciteerd! Je hebt gewonnen! Je bent een echte ingrediënten-expert!");
          } else {
            typeSpeechMessage("Speler 1 wint het spel! Goed gedaan!");
          }
        } else {
          winMessage.textContent = gameMode === 'vs-knof' ? 'Knof wint!' : 'Speler 2 wint!';
          startConfetti();
          
          if (gameMode === 'vs-knof') {
            typeSpeechMessage("Ik heb gewonnen! Maar jij deed het ook heel goed. Wil je nog een keer spelen?");
          } else {
            typeSpeechMessage("Speler 2 wint het spel! Gefeliciteerd!");
          }
        }
        
        toggleInteractionBlocking(false);
      }
      
      // Start gameplay after countdown
      function startGameplay() {
        // Generate ingredients for first round
        pancakeIngredients = generateIngredients();
        
        // Display the pancake and target
        displayPancake();
        displayTargetIngredient();
        
        // Start timer
        startTimer();
        
        // If playing against Knof, schedule his move
        if (gameMode === 'vs-knof') {
          scheduleKnofMove();
        }
      }
      
      // Initialize the game
      function initializeGame() {
        // Reset game state
        gameOver = false;
        currentRound = 1;
        updateRoundCounter();
        winMessage.textContent = '';
        
        // Clear any ongoing timers
        clearInterval(timerInterval);
        if (knofMoveTimeout) {
          clearTimeout(knofMoveTimeout);
          knofMoveTimeout = null;
        }
        
        // Stop any confetti
        stopConfetti();
        
        // Show countdown and then start the game
        showCountdown(startGameplay);
        
        // Show tutorial on first load (delayed after countdown)
        if (!localStorage.getItem('ingredientGameTutorialSeen')) {
          setTimeout(() => {
            tutorialOverlay.style.display = 'flex';
            pauseTimer();
            localStorage.setItem('ingredientGameTutorialSeen', 'true');
          }, 5000); // Show tutorial after countdown + a short delay
        }
      }
      
      // ===== EVENT LISTENERS =====
      
      backButton.addEventListener('click', function() {
        window.location.href = '../games.html';
      });
      
      resetScoresButton.addEventListener('click', function() {
        if (interactionBlocked) return;
        
        scores.player = 0;
        scores.opponent = 0;
        updateScores();
        winMessage.textContent = '';
        stopConfetti();
        
        typeSpeechMessage("Scores zijn gereset. We beginnen weer bij nul!");
        
        initializeGame();
      });
      
      restartButton.addEventListener('click', function() {
        if (interactionBlocked) return;
        
        winMessage.textContent = '';
        stopConfetti();
        initializeGame();
        
        typeSpeechMessage("Nieuw spel! Succes!");
      });
      
      helpButton.addEventListener('click', function() {
        if (interactionBlocked) return;
        
        tutorialOverlay.style.display = 'flex';
        pauseTimer();
      });
      
      tutorialClose.addEventListener('click', function() {
        tutorialOverlay.style.display = 'none';
        resumeTimer();
      });

      // Difficulty selection
      levelButtons.forEach(button => {
        button.addEventListener('click', function() {
          if (interactionBlocked) return;
          
          levelButtons.forEach(btn => btn.classList.remove('active'));
          this.classList.add('active');
          difficulty = this.dataset.level;
          
          // Update timer values
          if (!gameOver && !countdownActive) {
            // Alleen timer resetten als het spel bezig is
            resetTimer();
          }
          
          typeSpeechMessage(`Moeilijkheidsgraad aangepast naar ${getReadableDifficulty(difficulty)}!`);
        });
      });
      
      function getReadableDifficulty(diff) {
        switch(diff) {
          case 'easy': return 'makkelijk';
          case 'medium': return 'normaal';
          case 'hard': return 'moeilijk';
          default: return diff;
        }
      }
      
      // Resize event
      window.addEventListener('resize', function() {
        resizeCanvas();
        if (!gameOver && !countdownActive && !interactionBlocked) {
          displayPancake();
        }
      });
      
      // ===== INITIALIZE THE GAME =====
      initGameMode();
      initializeGame();
      updateScores();
      resizeCanvas();
    });
  </script>
</body>
</html>
