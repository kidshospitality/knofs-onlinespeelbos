<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ingrediënten Zoeken - Knof's Spelletjes</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#F8F6E9">
  <link rel="apple-touch-icon" href="../images/icon-192.png">
  <style>
    /* Basisstijlen */
    .game-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 10px;
      text-align: center;
    }

    /* Niveau keuze scherm */
    .level-select {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 30px 0;
    }

    .level-title {
      font-size: 1.8rem;
      color: #7A4127;
      margin-bottom: 10px;
    }

    .level-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .level-button {
      padding: 12px 25px;
      background-color: #FFDDA1;
      border: 3px solid #FFCC80;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      filter: url(#rough-filter);
    }

    .level-button:hover {
      transform: translateY(-5px);
      background-color: #FFD6A5;
    }

    /* Countdown scherm */
    .countdown-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
    }

    .countdown-number {
      font-size: 8rem;
      font-weight: bold;
      color: #FF9A5A;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    /* Target ingredient display */
    .target-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
    }

    .target-label {
      font-size: 1.5rem;
      color: #7A4127;
      margin-bottom: 20px;
    }

    .ingredient-display {
      position: relative;
      width: 350px;
      height: 350px;
    }

    .target-ingredient {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6rem;
      z-index: 2;
    }

    .non-target-ingredient {
      position: absolute;
      font-size: 3rem;
      opacity: 0.3;
      z-index: 1;
    }

    /* Game board */
    .game-board {
      display: none;
    }

    .score-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .score-display, .time-display {
      background-color: #FFD6A5;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      filter: url(#rough-filter);
      border: 2px solid #FF9A5A;
    }

    .pancake-container {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pancake {
      width: 350px;
      height: 350px;
      background-color: #FFEEB3;
      border-radius: 50%;
      position: relative;
      filter: url(#rough-filter);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      border: 4px solid #FFDDA1;
      overflow: hidden;
    }

    .pancake::before {
      content: '';
      position: absolute;
      width: 92%;
      height: 92%;
      top: 4%;
      left: 4%;
      background-color: #FFEF9E;
      border-radius: 50%;
      z-index: 0;
      filter: url(#squiggly-filter);
    }

    .game-ingredient {
      position: absolute;
      font-size: 3.5rem;
      z-index: 1;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .game-ingredient:hover {
      transform: scale(1.2);
    }

    .game-ingredient:active {
      transform: scale(0.9);
    }

    /* Results screen */
    .results-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    .results-title {
      font-size: 2rem;
      color: #7A4127;
      margin-bottom: 20px;
    }

    .results-score {
      font-size: 3rem;
      font-weight: bold;
      color: #FF9A5A;
      margin-bottom: 30px;
    }

    .results-message {
      font-size: 1.3rem;
      margin-bottom: 30px;
      text-align: center;
    }

    /* Buttons */
    .button-container {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .game-button {
      padding: 10px 20px;
      background-color: #A5BBFF;
      border: 2px solid #7A97FF;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
      filter: url(#rough-filter);
    }

    .game-button:hover {
      transform: translateY(-3px);
    }

    /* Popup bericht */
    .feedback-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .feedback-popup.correct {
      color: #4CAF50;
    }

    .feedback-popup.wrong {
      color: #F44336;
    }

    .feedback-popup.show {
      opacity: 1;
    }

    /* Media queries voor responsiveness */
    @media (max-width: 480px) {
      .pancake {
        width: 300px;
        height: 300px;
      }

      .game-ingredient {
        font-size: 3rem;
      }

      .ingredient-display {
        width: 300px;
        height: 300px;
      }

      .target-ingredient {
        font-size: 5rem;
      }
    }
  </style>
</head>
<body>
  <!-- SVG filters voor handgetekend effect -->
  <svg class="svg-filters" style="display: none;">
    <defs>
      <filter id="rough-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggly-filter">
        <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="3" result="turbulence" seed="2"/>
        <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" />
      </filter>
    </defs>
  </svg>

  <!-- Container voor top navigatie -->
  <div id="top-nav-container"></div>

  <!-- Hoofdcontent - Ingrediënten Zoeken spel -->
  <div class="app-container">
    <div class="game-container">
      <!-- Niveau selectie scherm -->
      <div class="level-select" id="level-select">
        <div class="level-title">Kies een niveau</div>
        <div class="level-buttons">
          <div class="level-button" id="easy-level">Makkelijk</div>
          <div class="level-button" id="medium-level">Normaal</div>
          <div class="level-button" id="hard-level">Moeilijk</div>
        </div>
        <div class="button-container">
          <button class="game-button" id="back-button">Terug</button>
        </div>
      </div>

      <!-- Aftellen scherm -->
      <div class="countdown-screen" id="countdown-screen">
        <div class="countdown-number" id="countdown-number">3</div>
      </div>

      <!-- Target ingredient scherm -->
      <div class="target-screen" id="target-screen">
        <div class="target-label">Zoek dit ingrediënt!</div>
        <div class="ingredient-display" id="ingredient-display">
          <div class="target-ingredient" id="target-ingredient">🍓</div>
          <!-- Andere vage ingrediënten worden hier toegevoegd -->
        </div>
      </div>

      <!-- Game board -->
      <div class="game-board" id="game-board">
        <div class="score-info">
          <div class="score-display">Score: <span id="score-value">0</span></div>
          <div class="time-display">Tijd: <span id="time-value">0</span></div>
        </div>
        <div class="pancake-container">
          <div class="pancake" id="pancake">
            <!-- Ingrediënten worden hier dynamisch toegevoegd -->
          </div>
        </div>
      </div>

      <!-- Resultaten scherm -->
      <div class="results-screen" id="results-screen">
        <div class="results-title">Resultaat</div>
        <div class="results-score" id="final-score">0 punten</div>
        <div class="results-message" id="results-message">Goed gedaan!</div>
        <div class="button-container">
          <button class="game-button" id="play-again-button">Speel opnieuw</button>
          <button class="game-button" id="menu-button">Menu</button>
        </div>
      </div>

      <!-- Feedback popup -->
      <div class="feedback-popup" id="feedback-popup"></div>
    </div>
  </div>

  <!-- Container voor bottom navigatie -->
  <div id="bottom-nav-container"></div>

  <!-- Scripts -->
  <script src="../js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Game elementen
      const levelSelectScreen = document.getElementById('level-select');
      const countdownScreen = document.getElementById('countdown-screen');
      const targetScreen = document.getElementById('target-screen');
      const gameBoard = document.getElementById('game-board');
      const resultsScreen = document.getElementById('results-screen');
      const feedbackPopup = document.getElementById('feedback-popup');
      
      const countdownNumber = document.getElementById('countdown-number');
      const targetIngredient = document.getElementById('target-ingredient');
      const ingredientDisplay = document.getElementById('ingredient-display');
      const pancake = document.getElementById('pancake');
      const scoreValue = document.getElementById('score-value');
      const timeValue = document.getElementById('time-value');
      const finalScore = document.getElementById('final-score');
      const resultsMessage = document.getElementById('results-message');
      
      const easyLevelButton = document.getElementById('easy-level');
      const mediumLevelButton = document.getElementById('medium-level');
      const hardLevelButton = document.getElementById('hard-level');
      const backButton = document.getElementById('back-button');
      const playAgainButton = document.getElementById('play-again-button');
      const menuButton = document.getElementById('menu-button');
      
      // Game variabelen
      const INGREDIENTS = [
        '🍓', '🍌', '🍫', '🍯', '🧀', '🍎', '🍊', '🥞', 
        '🍒', '🍋', '🥥', '🍦', '🍪', '🍰', '🍧', '🍩', 
        '🥜', '🍇', '🍬', '🍭', '🍈', '🥭', '🍑', '🍍', 
        '🍉', '🥝', '🍅', '🍐', '🧁', '🍨', '🍮'
      ];
      
      const LEVELS = {
        easy: { count: 5, rounds: 5, time: 20 },
        medium: { count: 7, rounds: 7, time: 15 },
        hard: { count: 9, rounds: 9, time: 10 }
      };
      
      let currentLevel = null;
      let currentRound = 0;
      let totalRounds = 0;
      let score = 0;
      let timeLeft = 0;
      let timerInterval = null;
      let currentTarget = null;
      
      // Event listeners
      easyLevelButton.addEventListener('click', () => startGame('easy'));
      mediumLevelButton.addEventListener('click', () => startGame('medium'));
      hardLevelButton.addEventListener('click', () => startGame('hard'));
      backButton.addEventListener('click', () => window.location.href = '../games.html');
      playAgainButton.addEventListener('click', resetGame);
      menuButton.addEventListener('click', showLevelSelect);
      
      function startGame(level) {
        currentLevel = level;
        totalRounds = LEVELS[level].rounds;
        currentRound = 0;
        score = 0;
        scoreValue.textContent = score;
        
        levelSelectScreen.style.display = 'none';
        startCountdown();
      }
      
      function startCountdown() {
        countdownScreen.style.display = 'flex';
        let count = 3;
        countdownNumber.textContent = count;
        
        const countInterval = setInterval(() => {
          count--;
          countdownNumber.textContent = count;
          
          if (count <= 0) {
            clearInterval(countInterval);
            countdownScreen.style.display = 'none';
            prepareNextRound();
          }
        }, 1000);
      }
      
      function prepareNextRound() {
        currentRound++;
        
        if (currentRound > totalRounds) {
          showResults();
          return;
        }
        
        // Selecteer ingrediënten voor deze ronde
        const shuffled = [...INGREDIENTS].sort(() => 0.5 - Math.random());
        const roundIngredients = shuffled.slice(0, LEVELS[currentLevel].count);
        currentTarget = roundIngredients[Math.floor(Math.random() * roundIngredients.length)];
        
        // Toon doelwit ingrediënt met vage ingrediënten eromheen
        showTargetIngredient(currentTarget, roundIngredients);
        
        // Na 2 seconden, toon de pannenkoek met ingrediënten
        setTimeout(() => {
          targetScreen.style.display = 'none';
          showGameBoard(roundIngredients);
          startTimer();
        }, 2000);
      }
      
      function showTargetIngredient(target, allIngredients) {
        targetScreen.style.display = 'flex';
        ingredientDisplay.innerHTML = '';
        
        // Toon het doelwit in het midden
        const targetElement = document.createElement('div');
        targetElement.className = 'target-ingredient';
        targetElement.textContent = target;
        ingredientDisplay.appendChild(targetElement);
        
        // Toon de andere ingrediënten vaag eromheen
        allIngredients.forEach(ingredient => {
          if (ingredient !== target) {
            const nonTargetElement = document.createElement('div');
            nonTargetElement.className = 'non-target-ingredient';
            nonTargetElement.textContent = ingredient;
            
            // Willekeurige positie rondom het centrum
            const angle = Math.random() * Math.PI * 2;
            const distance = 70 + Math.random() * 70; // 70px tot 140px van het centrum
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            
            nonTargetElement.style.left = `calc(50% + ${x}px)`;
            nonTargetElement.style.top = `calc(50% + ${y}px)`;
            
            ingredientDisplay.appendChild(nonTargetElement);
          }
        });
      }
      
      function showGameBoard(ingredients) {
        gameBoard.style.display = 'block';
        pancake.innerHTML = '';
        
        // Plaats ingrediënten op willekeurige posities binnen de pannenkoek
        ingredients.forEach(ingredient => {
          const element = document.createElement('div');
          element.className = 'game-ingredient';
          element.textContent = ingredient;
          
          // Bereken de pannenkoek radius (iets kleiner dan werkelijke grootte)
          const pancakeSize = pancake.offsetWidth;
          const pancakeRadius = (pancakeSize / 2) - 40; // 40px marge
          
          // Willekeurige positie binnen cirkel
          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * pancakeRadius;
          const x = 50 + Math.cos(angle) * distance;
          const y = 50 + Math.sin(angle) * distance;
          
          element.style.left = `${x}%`;
          element.style.top = `${y}%`;
          
          // Willekeurige rotatie voor speelsheid
          const rotation = Math.random() * 30 - 15; // -15 tot 15 graden
          element.style.transform = `rotate(${rotation}deg)`;
          
          // Click handler
          element.addEventListener('click', () => {
            handleIngredientClick(ingredient);
          });
          
          pancake.appendChild(element);
        });
      }
      
      function startTimer() {
        timeLeft = LEVELS[currentLevel].time;
        timeValue.textContent = timeLeft;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timeLeft--;
          timeValue.textContent = timeLeft;
          
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            showFeedback(false);
            
            setTimeout(() => {
              prepareNextRound();
            }, 1500);
          }
        }, 1000);
      }
      
      function handleIngredientClick(clickedIngredient) {
        clearInterval(timerInterval);
        
        if (clickedIngredient === currentTarget) {
          // Correct
          score++;
          scoreValue.textContent = score;
          showFeedback(true);
        } else {
          // Incorrect
          showFeedback(false);
        }
        
        setTimeout(() => {
          prepareNextRound();
        }, 1500);
      }
      
      function showFeedback(correct) {
        feedbackPopup.textContent = correct ? 'Juist!' : 'Helaas!';
        feedbackPopup.className = 'feedback-popup ' + (correct ? 'correct' : 'wrong');
        feedbackPopup.classList.add('show');
        
        setTimeout(() => {
          feedbackPopup.classList.remove('show');
        }, 1500);
        
        // Knof feedback via spraak (indien aanwezig)
        if (typeof typeSpeechMessage === 'function') {
          if (correct) {
            const praises = ["Goed gedaan!", "Heel goed!", "Prima!", "Goed zo!"];
            typeSpeechMessage(praises[Math.floor(Math.random() * praises.length)]);
          } else {
            const consolations = ["Jammer!", "Volgende keer beter!", "Helaas!"];
            typeSpeechMessage(consolations[Math.floor(Math.random() * consolations.length)]);
          }
        }
      }
      
      function showResults() {
        gameBoard.style.display = 'none';
        resultsScreen.style.display = 'flex';
        
        finalScore.textContent = `${score} van de ${totalRounds} punten`;
        
        // Bepaal bericht op basis van score
        const percentage = (score / totalRounds) * 100;
        let message;
        
        if (percentage >= 80) {
          message = "Fantastisch gedaan! Je bent een echte ingrediënten-expert!";
        } else if (percentage >= 60) {
          message = "Goed gedaan! Je kent je pannenkoekingrediënten goed!";
        } else if (percentage >= 40) {
          message = "Niet slecht! Met wat oefening word je nog beter!";
        } else {
          message = "Blijf oefenen, volgende keer gaat het beter!";
        }
        
        resultsMessage.textContent = message;
        
        // Spraakbericht van Knof
        if (typeof typeSpeechMessage === 'function') {
          typeSpeechMessage(message);
        }
      }
      
      function resetGame() {
        resultsScreen.style.display = 'none';
        startGame(currentLevel);
      }
      
      function showLevelSelect() {
        resultsScreen.style.display = 'none';
        levelSelectScreen.style.display = 'flex';
      }
      
      // Begin met niveau selectie
      showLevelSelect();
    });
  </script>
</body>
</html>
